<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--blue:#175cd3;--green:#067647;--red:#b42318;--dark:#101828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--dark);color:#fff;padding:15px 16px calc(13px + env(safe-area-inset-top));position:sticky;top:0;z-index:5}
h1{font-size:19px;margin:0 0 4px}.sub{font-size:12px;opacity:.8}
nav{display:flex;gap:7px;overflow:auto;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:71px;z-index:4}
nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}

main{max-width:920px;margin:auto;padding:15px 14px 50px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 2px 9px rgba(16,24,40,.04)}
h2{font-size:22px;margin:0 0 8px}h3{font-size:17px;margin:0 0 8px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:23px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select{font:inherit}
.primary,.secondary,.danger{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}
.primary{background:var(--blue);color:#fff}.secondary{background:#eef2f6;color:#344054}.danger{background:#fee4e2;color:var(--red)}
.list button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:11px;border-radius:10px;margin:6px 0;cursor:pointer}
.pill{display:inline-block;border-radius:99px;background:#eef4ff;color:#175cd3;padding:4px 8px;font-size:12px;font-weight:800}
.q{font-size:18px;line-height:1.45;font-weight:750;margin:13px 0}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin:7px 0;line-height:1.4;cursor:pointer}
.opt.correct{background:#ecfdf3;border-color:#6ce9a6}.opt.wrong{background:#fef3f2;border-color:#fda29b}.letter{font-weight:900;margin-right:7px}
.explain{margin-top:12px;padding:12px;border-radius:12px;background:#f2f4f7;border-left:4px solid var(--blue);line-height:1.5}
.answer{margin-top:7px;color:var(--green);font-weight:850}.progress{height:9px;background:#eaecf0;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);width:0}
.timer{font-variant-numeric:tabular-nums;font-size:21px;font-weight:900;margin-left:auto}.small{font-size:12px}.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:8px 0 12px}
.notice{padding:12px;border-radius:12px;background:#fffaeb;border:1px solid #fedf89;color:#93370d}a{color:var(--blue)}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
button:disabled{opacity:.4;cursor:default}.opt.correct{font-weight:700}
.illus{margin:12px 0 14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}.illusTitle{font-weight:800;font-size:14px;margin-bottom:8px;color:#344054}.illus svg{max-width:760px;margin:auto}.illus text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

tería."],"a":1,"ex":""},{"id":"T1-47","theme":1,"n":47,"q":"¿Para qué sirve el seguro manual?","o":["Para evitar el disparo, aun estando el arma montada.","Para que no se caiga el cargador del arma accidentalmente.","Para asegurar el blanco y efectuar un disparo certero."],"a":0,"ex":""},{"id":"T1-48","theme":1,"n":48,"q":"¿Qué pieza golpea el fulminante del cartucho?.","o":["El tope del cerrojo.","El percutor.","La uña de extracción."],"a":1,"ex":""},{"id":"T1-49","theme":1,"n":49,"q":"¿Qué avería se puede producir al disparar un arma en vacío?","o":["Encasquillamiento del cierre.","Bloqueo del elevador de cartucho.","Rotura de la aguja percutora."],"a":2,"ex":""},{"id":"T1-50","theme":1,"n":50,"q":"El mecanismo de seguridad de un arma, ¿qué misión tiene?.","o":["Evitar que se produzca un disparo involuntario.","Evitar que se cargue el arma.","Evitar que se descargue el arma."],"a":0,"ex":""},{"id":"T1-51","theme":1,"n":51,"q":"¿Puede tener seguro automático una escopeta de caza semiautomática?.","o":["Depende del año de fabricación.","Si.","Las escopetas semiautomáticas no tienen seguro automático."],"a":1,"ex":""},{"id":"T1-52","theme":1,"n":52,"q":"Si un arma tiene el seguro de mano en posición “S”, ¿puede efectuar el disparo","o":["Si.","No.","Si, si está alimentada y montada."],"a":1,"ex":""},{"id":"T1-53","theme":1,"n":53,"q":"¿Cómo se denomina la varilla que se utiliza para limpiar el interior del cañón de las armas?","o":["Escobilla","Baqueta","Plumero"],"a":1,"ex":""},{"id":"T1-54","theme":1,"n":54,"q":"¿Con qué producto limpiaremos las partes de madera de un arma","o":["Con agua y jabón.","Con gasolina o gasóleo.","Con aceite de linaza."],"a":2,"ex":""},{"id":"T1-55","theme":1,"n":55,"q":"Si se hubiese mojado el arma después de practicar el ejercicio de la caza, ¿cómo procederemos en relación con el arma","o":["Limpiar y engrasar el arma a la mayor brevedad para que no se oxide.","No es necesario limpiar el arma.","Basta con pasarle un trapo para secarla. toridad Gubernativa."],"a":1,"ex":""},{"id":"T6-7","theme":6,"n":7,"q":"¿Es imprescindible obtener la condición de armero para dedicarse a la reparación de armas de fuego?","o":["Algunas veces","Sí","Cuando se trate de armas blancas sí es necesario"],"a":1,"ex":""},{"id":"T6-8","theme":6,"n":8,"q":"¿Las industrias que fabrican armas de fuego están autorizadas a reparar las mismas?","o":["No, si la avería es muy grave","Sí","Depende del tipo de arma."],"a":1,"ex":""},{"id":"T6-9","theme":6,"n":9,"q":"¿Se admitirá un arma de fuego para su reparación si no lleva la Guía de pertenencia?","o":["Sí, cuando esté en muy mal estado","No, en ningún caso.","Sí, siempre que dicho documento se haya sustituido por una guía de circulación."],"a":2,"ex":""},{"id":"T6-10","theme":6,"n":10,"q":"¿Puede el titular de un arma de fuego llevarla personalmente a un establecimiento autorizado para su reparación?","o":["No","Sí, si va acompañada de la Guía de Pertenencia.","Sí, si va acompañada de la Guía de Pertenencia y Licencia correspondiente."],"a":2,"ex":""},{"id":"T6-11","theme":6,"n":11,"q":"La reparación de armas se hará solamente:","o":["Por las industrias que las hubiesen fabricado.","Por armeros/as, que autorizados/as por Intervención de Armas cuenten con establecimiento abierto al público y estén inscritos en el correspondiente registro.","Las dos respuestas anteriores (A y B) son válidas."],"a":2,"ex":""},{"id":"T6-12","theme":6,"n":12,"q":"No se admitirá un arma a reparar si no va acompañada de:","o":["Guía de Pertenencia.","Guía de Circulación.","La A) y la B) son correctas."],"a":2,"ex":""},{"id":"T6-13","theme":6,"n":13,"q":"¿Donde quedará la Guía de Pertenencia del arma que se esté reparando?:","o":["Será devuelta al propietario del arma una vez se tomen los datos del arma por el armero.","Quedará en poder del/la armero/a mientras dure la reparación del arma.","No es necesario, en este caso, que el arma vaya acompañada por la Guía de Pertenencia."],"a":1,"ex":""},{"id":"T6 iento del/de la titular de un arma, ¿qué deberán hacer los familiares con las armas del fallecido?","o":["Pueden hacer uso de las mismas sin ningún requisito previo.","Depositarlas en la Intervención de Armas","Pasarán a propiedad del hijo mayor de la familia"],"a":1,"ex":""},{"id":"T6-54","theme":6,"n":54,"q":"¿Qué plazo tienen los herederos/as de un arma, depositada en la Intervención de Armas y Explosivos por fallecimiento del/de la titular, para enajenarla?","o":["Una semana","Un año","No hay plazo establecido"],"a":1,"ex":""},{"id":"T6-55","theme":6,"n":55,"q":"En caso de anulación de la guía de pertenencia de un arma ¿qué debe hacerse con el arma?","o":["Depositarla inmediatamente en la Intervención de Armas.","Esperar a que me devuelvan la guía.","Nada"],"a":0,"ex":""},{"id":"T6-56","theme":6,"n":56,"q":"Señale el plazo de que disponen los/las herederos/as del/de la titular de una escopeta para depositarla en la Intervención de Armas y Explosivos en caso de fallecimiento del/de la titular:","o":["Tan pronto como tenga conocimiento de la obligación de hacerlo.","Dentro de los seis meses siguientes al fallecimiento.","Correctas A) y B)"],"a":2,"ex":""},{"id":"T6-57","theme":6,"n":57,"q":"Señale el plazo de que disponen los/las herederos/as del/de la titular de una escopeta para depositarla en la Intervención de Armas y Explosivos en caso de fallecimiento del/de la titular:","o":["Dentro de los seis meses siguientes al fallecimiento.","Al año del fallecimiento.","Las dos anteriores son correctas."],"a":0,"ex":""},{"id":"T6-58","theme":6,"n":58,"q":"Una escopeta depositada por infracción a la Ley de Caza, ¿podrá ser recuperada por su dueño/a?","o":["Sí","No","Algunas veces"],"a":0,"ex":""},{"id":"T6-59","theme":6,"n":59,"q":"¿Qué destino se le dará a las armas depositadas por infracción a la Ley de Caza, cuando los/las titulares de las mismas no deseen recuperarlas?","o":["Venderlas","Depositadas hasta que la Autoridad Judicial disponga de ellas.","Destruirlas"], con pólvora sin humo."],"a":1,"ex":""},{"id":"T7-11","theme":7,"n":11,"q":"¿Se podrá adquirir munición para el uso de las reproducciones de armas de fuego cortas antiguas?","o":["Sólo podrán adquirirse 100 cartuchos anuales por arma corta.","Podrán adquirirse 150 cartuchos anuales por arma corta.","Sólo podrán adquirirse 200 cartuchos anuales por arma corta."],"a":0,"ex":""},{"id":"T7-12","theme":7,"n":12,"q":"¿Se podrá tener en depósito munición para el uso de las reproducciones de armas de fuego largas antiguas?","o":["Podrá tener en depósito 250 cartuchos.","Podrá tener en depósito hasta 1000 cartuchos.","En ningún caso podrá tener en depósito un número superior a 200 cartuchos."],"a":2,"ex":""},{"id":"T7-13","theme":7,"n":13,"q":"El cartucho de pólvora ya se empleaba a mediados del siglo XVI, no obstante, respecto al cartucho de pólvora de percusión central, ¿Cuándo comenzó su uso?","o":["1550 a 1840.","1868 en adelante.","1845 a 1925."],"a":1,"ex":""},{"id":"T7-14","theme":7,"n":14,"q":"¿Cuál fue el primer ejército del mundo dotado con revólveres?","o":["El Ejército Español.","El Ejército Norteamericano.","El Ejercito Francés."],"a":1,"ex":""},{"id":"T7-15","theme":7,"n":15,"q":"¿Cuál fue la primera arma de repetición con cartucho metálico declarada reglamentaria en el Ejército Español?","o":["El revólver sistema Lafaucheaux.","El revólver Colt.","El revólver Remington"],"a":0,"ex":""},{"id":"T7-16","theme":7,"n":16,"q":"En relación a las armas retiradas por infracción a la Ley de Caza, si la Autoridad competente acordara la devolución de las mismas....","o":["Las armas estarán depositadas en la Intervención a disposición de los particulares por un plazo máximo de un mes.","A partir de un mes de la notificación por parte de la Autoridad competente, si no fuesen retiradas por su propietario serán destruidas","Ambas son correctas"],"a":2,"ex":""},{"id":"T7-17","theme":7,"n":17,"q":"¿Qué entendemos por munición de bala explosiva?","o":["Munición de uso civil con b const EX={"T5-1":"Un mismo hecho con armas puede ser delito (infracción penal) o infracción administrativa. B y C son incompletas: B olvida las administrativas y C habla solo de la gravedad de estas.","T5-2":"Las infracciones administrativas en armas se dividen en tres grados: muy graves, graves y leves. «Menos graves» no existe en esta clasificación.","T5-3":"Sancionan tanto el Delegado del Gobierno como el Director General de la Guardia Civil, y también el alcalde en su ámbito. Por eso B no basta y C (las dos anteriores) es la completa.","T5-4":"Pueden ordenar instruir el procedimiento el Director General, el Delegado del Gobierno y los alcaldes. El Interventor de Armas instruye y propone, pero no es quien lo ordena; Hacienda no interviene.","T5-5":"Regla de memoria: infracciones leves 3 meses, graves 1 año, muy graves 2 años. A más gravedad, más tiempo para prescribir.","T5-6":"Graves: 1 año. Recuerda la escala 3 meses – 1 año – 2 años (leves, graves, muy graves).","T5-7":"Muy graves: 2 años, el plazo más largo de las infracciones. 3 meses son las leves y 1 año las graves.","T5-8":"Las sanciones prescriben distinto que las infracciones: leves 1 año, graves 2 años, muy graves 4 años.","T5-9":"Sanciones graves: 2 años. Escala de sanciones: 1 – 2 – 4 años (leves, graves, muy graves).","T5-10":"Sanciones muy graves: 4 años, el máximo de la escala 1 – 2 – 4.","T5-11":"La sanción es ejecutiva cuando la resolución es firme en vía administrativa, es decir, cuando ya no cabe recurso en esa vía. No depende de plazos fijos de 10 o 30 días.","T7-1":"Es falso porque el enunciado da mal la fecha de corte: la categoría 6ª.2 se refiere a armas anteriores al 1 de enero de 1890, no de 1899.","T7-2":"Para usar armas de avancarga y demás de la 6ª.2 se exige certificado del banco oficial de pruebas y una autorización especial. La licencia ordinaria o la «especial de armas» no es lo que dice el artículo 107.c.","T7-3":"Arma antigua = modelo o año de fabricación anterior al 1 de enero de 1890. La A describe un arma de lujo o de valor especial y la B un calibre flobert; ninguna define «antigua».","T7-4":"Si solo se colecciona la reproducción y no se usa, se anota en un libro-registro de coleccionista. La guía especial y el certificado del banco de pruebas son para el uso, no para la mera colección.","T7-5":"Según el cuestionario es falso: la antigüedad (anterior a 1890) es un criterio que fija el propio Reglamento, no algo que decida la Dirección General.","T7-6":"Las reproducciones de armas cortas se guardan completas en caja fuerte, armario o armero con grado de seguridad clase III (UNE EN 1143-1). Las opciones B y C dicen clase I y la C admite guardar solo piezas.","T7-7":"Uso excepcional: en campos, galerías o polígonos de tiro controlados y con autorización especial. No se permite en concursos ni para caza mayor.","T7-8":"Reproducción = copia de un arma original que reúne todas sus características, aptitudes y posibilidades de uso. Si no las reúne (C) o la copia es parcial (A), no es reproducción.","T7-9":"Réplica = objeto que por su apariencia puede confundirse con un arma de fuego, sin serlo. Es la diferencia clave con la reproducción, que sí funciona como el original.","T7-10":"Las reproducciones de armas antiguas usan munición con pólvora negra y de su mismo calibre, no munición metálica actual ni pólvora sin humo.","T7-11":"Para armas cortas antiguas (reproducciones): 100 cartuchos anuales por arma. Memoriza la cifra 100.","T7-12":"Para armas largas antiguas (reproducciones) el depósito máximo es de 200 cartuchos, no más. Las cifras 250 y 1000 son trampa.","T7-13":"El cartucho de pólvora de percusión central empieza a usarse de 1868 en adelante, no antes.","T7-14":"El primer ejército del mundo con revólveres fue el norteamericano, por el revólver Colt.","T7-15":"El primer revólver de cartucho metálico reglamentario en el Ejército Español fue el sistema Lafaucheaux. Colt y Remington no.","T7-16":"Las dos afirmaciones son correctas: las armas quedan en la Intervención a disposición del titular un mes y, pasado ese mes desde la notificación sin retirarlas, se destruyen.","T7-17":"Bala explosiva = munición de uso militar con balas cuya carga explota por impacto. No es de uso civil.","T7-18":"Munición = cartucho, incluyendo la vaina. La vaina sí forma parte del cartucho, y el calibre 9 mm no es criterio para llamarlo munición.","T7-19":"Un arma se considera inutilizada solo cuando todos sus componentes esenciales han sido inutilizados, no uno ni dos.","T7-20":"Un arma de un solo tiro no puede llevar cargador: por definición carece de depósito de munición. No hay excepciones.","T7-21":"Según el cuestionario la respuesta correcta es «Sí, es correcto»: se admite considerar coleccionista a quien reúne componentes esenciales. Es una de las preguntas que conviene memorizar tal cual.","T7-22":"Transformar un arma de guerra en una civil se llama desmilitarización.","T5-12":"Sí se pueden imponer sanciones penales y administrativas por un mismo hecho relacionado con armas, cuando ambas vías son aplicables según la naturaleza de los hechos.","T1-1":"El arma automática dispara varios tiros seguidos manteniendo apretado el disparador una sola vez, sin soltarlo entre disparo y disparo. Eso la distingue de la semiautomática (un disparo por cada apretón) y de la de repetición (hay que accionar un mecanismo manual entre disparos).","T1-2":"La semiautomática se recarga sola tras cada disparo, pero solo dispara una vez por cada apretón del disparador. Si disparase varias veces con un solo apretón sería automática; si hubiera que accionar algo a mano sería de repetición.","T1-3":"En el arma de repetición es el propio tirador quien acciona un mecanismo (por ejemplo, una palanca o cerrojo) para recargar tras cada disparo. En la semiautomática y la automática la recarga es mecánica, no manual.","T1-4":"El arma de un solo tiro no tiene depósito de munición: hay que introducir el cartucho a mano en la recámara antes de cada disparo. Por eso no puede ser automática ni semiautomática, que sí tienen alimentación mecánica.","T1-5":"El cañón es el tubo por el que sale el proyectil; su interior (ánima) lo conduce y, si está rayado, le da el giro que lo estabiliza en el vuelo. El disparador solo acciona el disparo, no interviene en la trayectoria.","T1-6":"La culata se apoya en el hombro del tirador para encajar y sujetar el arma en el momento del disparo, además de ayudar a puntería. No sirve para instalar la mira y, evidentemente, la mayoría de armas largas sí la tienen.","T1-7":"El ánima de una escopeta puede ser lisa (lo habitual, para perdigones) o estriada (cañón estriado adaptable, para bala). Por eso la opción correcta admite ambas posibilidades, no solo una.","T1-8":"El rifle dispara balas y necesita que giren para ser precisas, así que su ánima es estriada (con rayas helicoidales), a diferencia de la escopeta que suele ser lisa.","T1-9":"Percutor, extractor y grapón forman parte del cerrojo (o cierre), la pieza móvil que golpea el cartucho, lo sujeta y ayuda a expulsarlo. No son parte de la culata ni, en sentido estricto, del cajón de mecanismos.","T1-10":"El guardamonte es el aro metálico que rodea y protege el disparador de golpes o accionamientos accidentales. No protege la biela ni el fiador directamente.","T1-11":"El muelle del cargador empuja los cartuchos hacia arriba manteniéndolos en posición, de modo que el siguiente quede frente a la recámara listo para ser introducido. No expulsa vainas ni mantiene presión por sí solo sin ese fin.","T1-12":"En un arma semiautomática es la biela (o el cierre, según el diseño) la pieza que empuja el cartucho desde el cargador hasta alojarlo en la recámara al recular y avanzar el mecanismo.","T1-13":"La banda ventilada entre los cañones de una escopeta superpuesta deja circular el aire para disipar el calor que se genera al disparar, evitando distorsión visual por el calor y mejorando la puntería.","T1-14":"Dentro del cerrojo de un rifle va alojado el mecanismo de percusión (percutor y su muelle), que es el que golpea el fulminante del cartucho.","T1-15":"El mecanismo de percusión está formado por el percutor y el muelle del percutor, que impulsa a este hacia delante para golpear el cartucho.","T1-16":"El cerrojo, al cerrarse, arrastra el cartucho desde el cargador hasta introducirlo en la recámara.","T1-17":"La uña extractora se engancha en el culote (la base) del cartucho cuando está en la recámara, de modo que al abrir el cerrojo pueda tirar de él para sacarlo.","T1-18":"El extractor es la pieza que engancha y saca la vaina de la recámara tras el disparo; no es un proceso manual ni depende de un muelle de recuperación.","T1-19":"El choke es un estrechamiento (estrangulamiento) de la boca del cañón de la escopeta que concentra más o menos el plomeo de los perdigones. No afecta a la recámara.","T1-20":"Los rifles semiautomáticos, al disparar bala única y no perdigones, no necesitan estrangular la boca del cañón para agrupar el disparo, así que carecen de choke.","T1-21":"En una escopeta superpuesta, los extractores son dos uñas que enganchan los culotes de los cartuchos para sacarlos de sus recámaras al abrir el arma.","T1-22":"La recámara de un arma larga rayada tiene la forma de la vaina del cartucho que va a alojar, para que encaje exactamente antes del disparo.","T1-23":"Las armas largas rayadas de caza mayor usan percusión central: el percutor golpea el centro de la base del cartucho, a diferencia del sistema Flobert (percusión anular/lateral).","T1-24":"El seguro manual es el dispositivo que el propio tirador acciona para bloquear el mecanismo de disparo y evitar que se dispare de forma involuntaria.","T1-25":"La boca es el extremo del cañón por donde sale el proyectil, opuesto al extremo donde se aloja el cartucho (la recámara/cámara).","T1-26":"Un arma está montada cuando su mecanismo de disparo y percusión está en disposición de disparar (por ejemplo, con el martillo o percutor amartillado), independientemente de que tenga o no munición.","T1-27":"Un arma alimentada es la que tiene cartuchos alojados en su mecanismo de alimentación (cargador o depósito), listos para pasar a la recámara.","T1-28":"Montada es aquella cuyo mecanismo de disparo y percusión está preparado para funcionar (listo para golpear el fulminante en cuanto se accione el disparador).","T1-29":"El cartucho se aloja en la recámara justo antes de ser disparado; el cargador o depósito solo lo mantiene en espera.","T1-30":"La escopeta semiautomática expulsa el cartucho ya disparado por la ventana de expulsión, situada en el lateral del cajón de mecanismos.","T1-31":"Alimentar una escopeta semiautomática consiste en colocar los cartuchos en el depósito (tubular, normalmente bajo el cañón); introducirlos en la recámara sería ya montarla para disparar.","T1-32":"Cargar es introducir los cartuchos en el depósito o cargador; alimentar (poner el arma en disposición de disparo) es llevar un cartucho a la recámara y montarla. Son acciones distintas y complementarias.","T1-33":"Además de los extractores (que sacan la vaina de la recámara), algunos modelos de escopeta superpuesta incorporan expulsores, que además la lanzan fuera del arma; no lo tienen todas.","T1-34":"El mecanismo de puntería (alza y punto de mira) es el que permite enfilar el arma hacia el blanco con precisión.","T1-35":"El alza regula la elevación: subiéndola o bajándola se corrige dónde impacta el proyectil en altura.","T1-36":"El punto de mira, al desplazarlo lateralmente, corrige el impacto en el eje horizontal.","T1-37":"La biela transmite el movimiento que el dedo ejerce sobre el disparador hasta el fiador, que a su vez libera el percutor.","T1-38":"En la semiautomática, el retroceso del disparo mueve hacia atrás el cierre, y ese movimiento es el que expulsa automáticamente la vaina; no depende de la voluntad del tirador ni de otro mecanismo aparte.","T1-39":"Esos orificios en el cajón de mecanismos de algunos rifles sirven de vía de escape de gases si el cartucho se rompe al disparar, protegiendo al tirador.","T1-40":"El guardamonte es el aro que rodea y protege el disparador de golpes o accionamientos accidentales; el guardamano protege la mano en el cañón, no el disparador.","T1-41":"El Reglamento de Armas considera la báscula (el cuerpo que une cañón, culata y mecanismos) pieza fundamental de la escopeta, igual que el cañón y la culata.","T1-42":"El cañón es, junto con la báscula y la culata, una de las piezas fundamentales de la escopeta según el Reglamento de Armas.","T1-43":"La culata de un rifle está considerada pieza fundamental del arma por el Reglamento de Armas.","T1-44":"Los elementos de puntería (alza y punto de mira) no se consideran piezas fundamentales de la escopeta, a diferencia del cañón, cierre y culata.","T1-45":"Las piezas fundamentales de una escopeta son cierre, cañón y culata; sin cualquiera de ellas el arma queda inutilizada como tal.","T1-46":"Las piezas fundamentales de un rifle son cerrojo, cañón y culata (equivalentes al cierre, cañón y culata de la escopeta).","T1-47":"El seguro manual sirve para evitar que se produzca un disparo aunque el arma esté montada, bloqueando el mecanismo de disparo.","T1-48":"El percutor es la pieza que golpea el fulminante situado en la base del cartucho, provocando la ignición de la pólvora.","T1-49":"Disparar un arma en vacío (sin cartucho) puede romper la aguja o punta del percutor, al golpear en el vacío sin nada que amortigüe el golpe.","T1-50":"El mecanismo de seguridad tiene como misión evitar un disparo involuntario, no impedir cargar ni descargar el arma.","T1-51":"Sí, las escopetas de caza semiautomáticas pueden llevar seguro automático (se activa solo al montar el arma o abrir la culata), además del seguro manual.","T1-52":"Con el seguro puesto en posición «S» (seguro) el mecanismo de disparo queda bloqueado y el arma no puede dispararse, esté o no montada y alimentada.","T1-53":"La baqueta es la varilla que se introduce por el cañón para limpiar su interior con escobillas o paños.","T1-54":"Las partes de madera de un arma (culata, guardamano) se cuidan con aceite de linaza, que las nutre y protege sin dañarlas; el agua y jabón o los disolventes las estropearían.","T1-55":"Un arma mojada debe limpiarse y engrasarse cuanto antes para evitar que la humedad oxide el metal; pasar solo un trapo no elimina la humedad interna.","T1-56":"Las armas de categoría 2ª.2 (largas rayadas de caza mayor) deben guardarse en el propio domicilio dentro de un armero homologado, no sueltas en cualquier mueble.","T1-57":"Nunca debe dejarse un arma en el maletero de un vehículo estacionado en la vía pública de un día para otro: ni el cierre del maletero ni la cercanía al domicilio evitan el riesgo de robo o accidente.","T1-58":"Un arma de fuego debe transportarse siempre descargada, también en época de caza; llevarla cargada o lista para disparar dentro del vehículo está prohibido por seguridad.","T1-59":"Las armas se guardan siempre descargadas y sin alimentar (sin cartuchos en cargador o depósito), no cargadas ni listas para usar.","T1-60":"La norma básica de seguridad es tratar cualquier arma como si estuviera siempre cargada, aunque se sepa que está descargada, para no bajar nunca la guardia.","T1-61":"Antes de manipular cualquier arma hay que comprobar siempre que está descargada, con independencia de si tiene o no puesto el seguro.","T1-62":"Para limpiar un arma conviene hacerlo en una habitación donde se esté solo, evitando distracciones y la presencia de otras personas que puedan sufrir un disparo accidental.","T1-63":"Si se desconoce el funcionamiento de un arma, nunca debe manipularse: es preferible dejarla como está o pedir ayuda a alguien que sepa, para no provocar un disparo accidental al desmontarla o accionarla.","T1-64":"Las normas de seguridad en el manejo de armas buscan sobre todo evitar disparos fortuitos que causen daños irreparables a personas, no solo evitar sanciones o el deterioro del arma.","T1-65":"Al coger un arma de fuego, el dedo nunca debe ir sobre el disparador hasta el momento de disparar, para evitar un disparo accidental al sujetarla o moverla.","T1-66":"Ante la presencia o proximidad de otras personas, la actuación correcta es descargar el arma, eliminando el riesgo real de disparo accidental.","T1-67":"Al cerrar la escopeta, la boca del cañón debe apuntar siempre hacia el suelo, nunca hacia arriba ni en horizontal, para que un disparo accidental no alcance a nadie.","T1-68":"Antes de disparar con un rifle de caza mayor hay que estar seguro de la zona de impacto (qué hay detrás y alrededor del blanco), no solo de la trayectoria o la carga del cartucho.","T2-1":"La categoría de un arma se fija según sus características, su destino o utilización, y en ocasiones también según la licencia que la ampara; no basta solo con su peligrosidad.","T2-2":"Las ballestas (7ª categoría) están jurídicamente asimiladas a las escopetas, por lo que sí pueden documentarse con licencia D, igual que una escopeta.","T2-3":"Ese mismo criterio de asimilación a escopeta no se aplica a los arcos, que no están sujetos a licencia de armas del mismo modo que las ballestas.","T2-4":"El Reglamento prohíbe, aunque no los cite expresamente uno por uno, cualquier instrumento especialmente peligroso para la integridad física de las personas y los que llevan puntas de flecha; ambos supuestos están prohibidos.","T2-5":"Arma de fuego corta es la que tiene el cañón de hasta 30 cm o una longitud total de hasta 60 cm; si supera cualquiera de esas medidas, deja de considerarse corta.","T2-6":"Arma de fuego larga es, por exclusión, cualquier arma de fuego que no sea corta (no cumple los límites de longitud de las cortas).","T2-7":"Aunque tenga cañón con rayas para mejorar el plomeo, si conserva el punzón de escopeta de un banco de pruebas sigue clasificándose como escopeta, no como arma larga rayada de caza mayor (2ª.2).","T2-8":"Un arma larga de ánima lisa que no es escopeta sí puede clasificarse en la 3ª categoría (que agrupa, entre otras, armas largas de ánima lisa distintas de la escopeta).","T2-9":"Esa misma arma (larga, ánima lisa, no escopeta) no entra en la 2ª categoría, que está reservada a armas largas rayadas para caza mayor o vigilancia, entre otras.","T2-10":"El Reglamento de Armas clasifica las armas reglamentadas en nueve categorías.","T2-11":"Las pistolas semiautomáticas se incluyen en la 1ª categoría, junto con revólveres y otras armas cortas de repetición o semiautomáticas.","T2-12":"Un arma corta de un solo tiro, calibre 22, se clasifica en la 4ª categoría (armas cortas de un solo tiro), distinta de la 1ª (repetición/semiautomáticas).","T2-13":"Un revólver, sea cual sea su longitud de cañón o calibre, pertenece a la 1ª categoría (armas cortas de repetición).","T2-14":"Una escopeta con cañón estriado adaptable y recámara para cartuchos metálicos se clasifica en la 2ª categoría, no en la 3ª (escopetas «normales») ni en la 1ª.","T2-15":"Además de las armas largas rayadas para vigilancia y guardería, la 2ª categoría incluye los cañones estriados adaptables a escopetas de caza con recámara para cartuchos metálicos no clasificados como de guerra.","T2-16":"En esta variante de la pregunta, la 2ª categoría también incluye las armas largas rayadas utilizables para caza mayor, además de las de vigilancia y guardería.","T2-17":"Los cañones estriados adaptables a escopetas, con recámara para cartuchos metálicos y no clasificados como de guerra, se incluyen en la 2ª categoría.","T2-18":"Las escopetas están clasificadas en la categoría 3ª.2 (armas largas de ánima lisa), no en la 3ª.1 (rayadas de tiro deportivo) ni en la 2ª.2.","T2-19":"Pertenecen a la 2ª categoría tanto las armas largas rayadas para caza mayor como las armas largas para vigilancia y guardería: las dos opciones son correctas conjuntamente.","T2-20":"A la 3ª categoría pertenecen tanto las escopetas como las armas largas rayadas del calibre 5,6 mm para tiro deportivo: ambas respuestas son ciertas.","T2-21":"De las citadas, a la 2ª categoría pertenecen las armas largas rayadas (para caza mayor o vigilancia); las escopetas y ballestas no están en esta categoría.","T2-22":"Las armas largas rayadas del calibre 5,6 mm para tiro deportivo se incluyen en la 3ª categoría (concretamente 3ª.1).","T2-23":"De las citadas, las escopetas pertenecen a la 3ª categoría (3ª.2); los revólveres son de la 1ª y los arcos no están sujetos a esta clasificación de licencia.","T2-24":"Una carabina de aire comprimido de repetición cuyo proyectil supera 24,2 julios en boca se clasifica en la 3ª.3 (armas accionadas por aire u otro gas comprimido de esa energía).","T2-25":"Un arma larga rayada calibre 5,6 mm (.22), de percusión anular y semiautomática para tiro deportivo se clasifica en la 3ª categoría (3ª.1).","T2-26":"Los revólveres de doble acción por aire u otro gas comprimido, no asimilados a escopeta, se clasifican en la 4ª.1 (no en la 3ª.3, que es para carabinas de repetición de mayor energía).","T2-27":"Las carabinas de ánima lisa o rayada, de un solo tiro, accionadas por aire u otro gas comprimido y no asimiladas a escopeta, pertenecen a la 4ª.2.","T2-28":"Los revólveres de acción simple accionados por aire u otro gas comprimido, no asimilados a escopeta, se clasifican en la 4ª.2.","T2-29":"Si esa misma carabina de repetición no supera los 24,2 julios en boca, se clasifica en la 4ª.1 en vez de en la 3ª.3.","T2-30":"Las armas blancas, en general, se clasifican en la 5ª categoría.","T2-31":"Un rifle semiautomático con cargador para cinco cartuchos no es arma prohibida a particulares: el límite que la prohíbe está en más cartuchos (once para rifles), como se ve en otra pregunta de este mismo tema.","T2-32":"Las ballestas se clasifican en la categoría 7ª.2.","T2-33":"Las armas largas específicas para funciones de guardería se clasifican en la categoría 2ª.1, distinta de la 2ª.2 (caza mayor).","T2-34":"Las armas largas de fuego calibre 22 americano, de percusión anular y de repetición para tiro deportivo, se clasifican en la 3ª categoría.","T2-35":"Las armas largas rayadas para caza mayor están clasificadas en la categoría 2ª.","T2-36":"Las armas inutilizadas se clasifican en la categoría 9ª, la reservada específicamente para ellas.","T2-37":"Las armas de alarma se clasifican en la categoría 7ª.6.","T2-38":"Un rifle que dispara varias veces seguidas con solo accionar repetidamente el disparador (un tiro por cada apretón) es semiautomático, no automático ni de repetición.","T2-39":"Un rifle semiautomático es arma prohibida a particulares si su cargador admite más de once cartuchos; con doce, supera ese límite y queda prohibido.","T2-40":"Una pistola semiautomática es arma prohibida a particulares si su cargador admite más de veintiún cartuchos; con veinticinco, supera ese límite.","T2-41":"Un arma automática transformada en semiautomática sigue siendo arma prohibida a particulares: la transformación no la legaliza.","T2-42":"Una escopeta de calibre 20 mm no encaja en ningún calibre de caza reglamentario (los calibres de escopeta se miden distinto, en «gauge», y ese tamaño correspondería a un arma de guerra), por lo que la afirmación correcta es que se trata de un arma de guerra.","T2-43":"A los particulares les está prohibida por completo la adquisición, tenencia y uso de armas de guerra, sin excepciones para ellos.","T2-44":"Las armas de fuego automáticas se consideran siempre armas de guerra, con independencia de su calibre o uso previsto.","T2-45":"Solo el Ministro de Defensa puede autorizar la legalización de un arma de guerra para un particular, de forma excepcional.","T2-46":"Calibres de guerra como el 308 Win o el 7,62×39 solo pueden usarse en caza mayor si se emplean con bala expansiva y en rifle de repetición (no automático ni semiautomático).","T2-47":"Tanto los silenciadores adaptables a armas de fuego como los puñales están incluidos entre las armas y objetos prohibidos.","T2-48":"Se consideran prohibidas tanto las armas resultado de modificar sustancialmente otra sin autorización de modelo o prototipo como las de culata plegable pensadas para el cazador en terreno abrupto: ambas lo son.","T2-49":"Un arma modificada sustancialmente respecto a su modelo de origen, sin la autorización reglamentaria correspondiente, se considera arma prohibida.","T2-50":"Entre las prohibidas están las armas de fuego largas con el cañón recortado, a diferencia de los cuchillos de cierta longitud o las cerbatanas, que se regulan de otro modo.","T2-51":"Las armas de fuego, reales o simuladas, combinadas con armas blancas se consideran armas prohibidas.","T2-52":"Un arma de fuego simulada bajo la apariencia de otro objeto (por ejemplo un bolígrafo o un mechero) es un arma prohibida.","T2-53":"De las armas blancas citadas, están prohibidos tanto los puñales como los machetes militares para desollar caza.","T2-54":"Sí se permite el uso de miras telescópicas en armas de la categoría 2ª.2 (largas rayadas de caza mayor).","T2-55":"También se permite el uso de miras telescópicas en armas de la categoría 3ª.2 (escopetas).","T2-56":"Un arma larga con un dispositivo en la culata para alojar una pistola legalizada se considera un arma prohibida, por combinar dos armas de fuego en una.","T2-57":"De las armas blancas citadas, están prohibidas las navajas de hoja inferior a 11 centímetros (por su carácter oculto/fácil ocultación), no así espadas o puñales en este supuesto concreto.","T2-58":"Un cuchillo de monte de doble filo, puntiagudo y con hoja de 20 cm se considera arma prohibida, por sus características ofensivas más allá de una herramienta de caza normal.","T2-59":"De las citadas, se consideran armas prohibidas las navajas automáticas (de resorte), a diferencia de navajas cortas o cuchillos de monte de menor filo.","T2-60":"No se puede poseer un rompecabezas como instrumento auxiliar de caza mayor: se considera arma prohibida.","T2-61":"Solo se permite un silenciador por persona, con independencia del número de armas largas rayadas para caza mayor que posea.","T2-62":"Ni siquiera con licencia de armas se puede tener o usar armas de fuego largas con cañón recortado; solo lo permite a funcionarios especialmente habilitados.","T2-63":"Un arma simulada combinada con un arma blanca se considera arma prohibida, sea cual sea el tipo de arma blanca combinada.","T2-64":"Una escopeta con un mecanismo en la culata para alojar otra arma no puede legalizarse en España, por tratarse de un arma prohibida, aunque sea legal en el país de compra.","T2-65":"Tampoco puede legalizarse una escopeta con mecanismo en la culata para alojar una navaja para desollar: se considera arma prohibida igualmente.","T2-66":"Entre la cartuchería prohibida a particulares está la de balas perforantes, explosivas o incendiarias; la munición blindada normal sí es de uso civil permitido.","T2-67":"En esta variante, también están prohibidas a particulares las municiones con proyectiles dum-dum (expansivas de fragmentación), junto con las perforantes, explosivas o incendiarias.","T3-1":"El documento que ampara el traslado de un arma de 2ª o 3ª categoría entre dos lugares, sin licencia ni guía de pertenencia, se llama guía de circulación.","T3-2":"Cuando se compra una escopeta fuera de la localidad de residencia, es la Intervención de Armas del lugar de la compra la que expide la guía de circulación para llevarla hasta el domicilio.","T3-3":"Es cierto: si el arma va acompañada de guía de pertenencia y licencia, no hace falta además guía de circulación para transportarla entre localidades.","T3-4":"La guía de circulación para un arma de 3ª categoría la expide la Intervención de Armas y Explosivos, no un mando militar de la Guardia Civil.","T3-5":"Enviar a reparar una báscula de escopeta requiere guía de circulación porque es un componente esencial del arma, sujeto a las mismas cautelas que el arma completa.","T3-6":"Cuando la escopeta viaja sin guía de pertenencia y sin licencia, el documento que ampara su traslado es precisamente la guía de circulación.","T3-7":"Necesitan guía de circulación para trasladarse sin guía de pertenencia y sin licencia tanto las armas de la 3ª categoría como las de la 8ª.","T3-8":"Una carabina de aire comprimido solo necesita guía de circulación si su energía en boca supera los 24,2 julios; por debajo de ese umbral no la necesita.","T3-9":"No necesitan guía de circulación para el traslado entre localidades ni las escopetas ni las armas largas rayadas (van amparadas de otra forma o exentas, según el caso planteado); las dos afirmaciones son falsas tal y como se formulan.","T3-10":"Tanto las escopetas como las armas largas rayadas sí necesitan guía de circulación cuando se trasladan sin guía de pertenencia y sin licencia entre localidades distintas.","T3-11":"Cuando el arma se envía a reparar a otra localidad, además de la guía de circulación se exige la guía de pertenencia, que acredita la titularidad del arma.","T3-12":"Es cierto: el Reglamento exige que las armas y sus componentes esenciales acabados circulen en envases debidamente acondicionados para su seguridad durante el traslado.","T3-13":"No se pueden enviar juntas en un mismo envase las escopetas y sus municiones al repararlas: deben ir separadas.","T3-14":"Los envases con armas largas de cañón estriado los precinta la Intervención de Armas de la Guardia Civil o el armero autorizado, no el servicio de Correos ni la empresa transportista.","T3-15":"Las armas reglamentadas y sus componentes esenciales deben circular en envases debidamente acondicionados para su seguridad durante el traslado.","T3-16":"Dos armas del mismo propietario que van a fábricas distintas de Éibar no pueden remitirse en un mismo envase, al tener destinatarios distintos.","T3-17":"No se puede enviar en un mismo paquete un rifle (cañón estriado) junto con una escopeta de caza, aunque vayan al mismo armero.","T3-18":"Es cierto: el Reglamento prohíbe en todo caso enviar o transportar armas cargadas, así como armas junto con la cartuchería que podría usarse con ellas.","T3-19":"Sí se puede enviar una escopeta a reparar por Correo, siempre que no se envíe junto con munición.","T3-20":"En ningún caso pueden enviarse a reparar armas cargadas, sean cortas o largas.","T3-21":"El particular que compra una escopeta fuera de su localidad tiene diez días de plazo para presentarse en la Intervención de Armas de su residencia y solicitar la guía de pertenencia.","T3-22":"Si el titular no lleva personalmente la escopeta a reparar, debe enviarla a través de una empresa de transportes.","T3-23":"Un particular que compra un arma larga rayada fuera de su localidad no puede transportarla personalmente hasta la Intervención de Armas de su residencia: debe usar el procedimiento reglamentario (guía de circulación/empresa de transportes), no llevarla él mismo.","T3-24":"En ningún caso pueden enviarse armas cargadas, ni tampoco armas junto con su cartuchería correspondiente: ambas prohibiciones son ciertas.","T3-25":"La declaración del contenido de un envío de armas debe figurar, con caracteres claros, tanto en la documentación como en el propio paquete.","T3-26":"Un rifle de caza mayor recién comprado, sin guía de pertenencia todavía, debe transportarse hasta el domicilio del titular por medio de una empresa de transporte, no llevándolo el comprador personalmente.","T3-27":"Al recibir la notificación de que le ha llegado una escopeta a la Intervención de Armas, el particular debe presentarse allí provisto de la licencia o documento que le autorice a adquirirla.","T3-28":"Es cierto: para retirar de la Intervención de Armas una escopeta que le han enviado, el destinatario debe presentar la licencia o documento que acredite que puede adquirirla.","T3-29":"Aunque coincide con la regla general de otras preguntas del tema (1ª categoría y concurso cada 3 años, el resto cada 5), el cuestionario oficial marca esta formulación exacta como falsa; conviene memorizar que, tal y como está redactada aquí, la respuesta correcta es «Falso».","T3-30":"Las armas de la 2ª categoría pasan revista cada cinco años, como la generalidad de las armas sujetas a guía de pertenencia.","T3-31":"Las armas de la 3ª categoría también pasan revista cada cinco años (no están entre las excepciones de tres años, reservadas a la 1ª categoría y a las de concurso).","T3-32":"Sí, es necesario presentar físicamente el arma para pasar la revista correspondiente.","T3-33":"No pasar dos revistas seguidas del arma sí es causa de anulación y retirada de la guía de pertenencia.","T3-34":"La revista de una escopeta se pasa en el mes correspondiente a la renovación de la licencia del titular, no en un mes fijo para todos ni ligado a la veda de caza.","T3-35":"Un familiar con licencia de armas que quiera pasar la revista del arma de otro titular necesita autorización escrita de ese titular, no basta con acreditar el parentesco.","T3-36":"Además de la anulación y retirada de la guía de pertenencia, no pasar dos revistas consecutivas da lugar a la apertura de un expediente sancionador.","T3-37":"Es el Interventor de Armas quien realiza las anotaciones correspondientes al pasar la revista de las armas.","T3-38":"Para pasar la revista de armas es imprescindible tanto presentar el arma como que la pase personalmente su titular: ambos requisitos son ciertos.","T3-39":"No pasar la revista de armas constituye una infracción administrativa, no un delito ni una falta penal.","T3-40":"Una escopeta de caza pasa revista cada cinco años, como el resto de armas sujetas a guía de pertenencia que no son de la 1ª categoría ni de concurso.","T3-41":"Las armas de concurso pasan revista cada tres años, igual que las de la 1ª categoría.","T3-42":"Las ballestas no pasan revista de armas, precisamente por no ser armas de fuego.","T3-43":"Un tercero con licencia de armas sí puede pasar la revista de una escopeta ajena, pero únicamente si el titular lo autorizó por escrito.","T3-44":"Una carabina de aire comprimido de la 4ª categoría no tiene que pasar revista de armas, a diferencia de las armas de fuego sujetas a guía.","T3-45":"En ningún caso puede pasarse la revista de armas sin presentar el arma en la Intervención de Armas o en el Puesto de la Guardia Civil.","T3-46":"Un cañón estriado adaptable a escopeta, con recámara para cartuchos metálicos, pasa revista cada 5 años, como el resto de armas de guía no exceptuadas.","T3-47":"Una carabina de repetición por gas comprimido no asimilada a escopeta pasa revista cada 5 años, al igual que las demás armas de su categoría sujetas a guía.","T3-48":"Sí, una carabina de aire comprimido cuyo proyectil supera 24,2 julios de energía en boca debe pasar revista de armas, al estar sujeta a guía de pertenencia por superar ese umbral.","T3-49":"Es cierto que quien va a enajenar un arma debe cederla a una persona que posea la licencia, tarjeta o certificado de inutilización correspondiente, según lo exigido por el Reglamento.","T3-50":"Al enajenar un arma, el vendedor particular entrega la guía de pertenencia directamente al comprador (adquirente).","T3-51":"Siempre debe comunicarse a la Intervención de Armas la enajenación de un arma, sin excepciones.","T3-52":"Cuando el arma se enajena a una armería, no es necesario participar por separado la enajenación a la Intervención de Armas, porque el trámite se canaliza a través del propio armero.","T3-53":"El comprador de un arma de fuego debe estar en posesión de la licencia correspondiente al tipo de arma que pretende adquirir; sin ese requisito no puede completarse la operación.","T3-54":"Al enajenarse un arma entre particulares, se expide una nueva guía de pertenencia a nombre del comprador.","T3-55":"La venta de un arma de fuego debe hacerse siempre con conocimiento de la Intervención de Armas correspondiente, no de la Policía ni de la Dirección General de la Guardia Civil directamente.","T3-56":"Es cierto que los extranjeros residentes en España pueden prestar sus armas de caza a quien tenga licencia de caza y la licencia de arma correspondiente (larga rayada para caza mayor o escopeta).","T3-57":"Para que a alguien se le pueda ceder un arma, debe poseer la correspondiente licencia de armas; ser propietario de un coto o tener afición cinegética no es suficiente por sí solo.","T3-58":"Las armas de caza pueden prestarse durante un máximo de quince días.","T3-59":"La cesión temporal de un arma debe hacerse siempre por escrito, fechada y firmada, no de palabra ni por teléfono.","T3-60":"Una persona de nacionalidad española puede prestar su escopeta a quienes estén provistos de la licencia de armas correspondiente y de licencia de caza; no basta solo con la licencia de caza.","T3-61":"El titular de un arma larga rayada para caza mayor puede prestarla a quienes tengan la licencia de armas correspondiente y licencia de caza; no puede prestarla a cualquiera.","T3-62":"Es cierto que las armas de caza pueden prestarse a quien tenga licencia de caza y la licencia de armas larga rayada o de escopeta correspondiente.","T3-63":"Las escopetas siempre se prestan acompañadas de su guía de pertenencia.","T3-64":"Las armas de caza en general se prestan siempre con sus guías de pertenencia, documento que las acompaña obligatoriamente.","T3-65":"No se pueden prestar armas de caza a quien no tenga licencia de caza, ni siquiera aduciendo que dispone de finca privada para cazar.","T3-66":"Para obtener la guía de pertenencia de un arma hay que acreditar que se cumplen las medidas de seguridad exigidas para su custodia (armero homologado, etc.).","T4-1":"Un rifle automático no puede ampararse en licencia D porque es arma de guerra prohibida a particulares, con independencia del tipo de munición que emplee.","T4-2":"Para que se expida una licencia de armas, el peticionario debe tener como mínimo 18 años.","T4-3":"Solo se puede poseer una licencia de armas «D» por persona.","T4-4":"Para practicar la caza mayor con un arma larga rayada, el titular debe portar la licencia D y la guía del arma que utilice, no solo la guía o solo una tarjeta.","T4-5":"Sí puede expedirse licencia de armas a un español residente en Francia; no depende de que Francia sea país de la UE, sino de su condición de español.","T4-6":"No, porque el uso de una escopeta inscrita como pieza de colección está prohibido para cazar, aunque el titular de la licencia E sea la misma persona que la tiene inscrita en el libro-registro.","T4-7":"Para poseer una escopeta de caza en España es necesaria la licencia de armas tipo «E», que es la que ampara este tipo de arma.","T4-8":"Solo las personas con licencia de armas tipo «D» pueden tener y usar alzas o miras telescópicas para armas de caza mayor; no basta con carecer de restricción o pedir autorización especial.","T4-9":"Para poseer un rifle de caza mayor hace falta tener como mínimo 18 años y estar en posesión de la licencia de armas tipo «D»; no existe una vía intermedia para menores con autorización especial en este caso.","T4-10":"Un arma combinada (escopeta y rifle) se documenta con una sola guía de pertenencia, atendiendo al arma de mayor peligrosidad de las dos que la componen.","T4-11":"Quien tiene una escopeta y un arma larga rayada para caza mayor debe disponer de licencia «D» y «E», una para cada tipo de arma.","T4-12":"Ante la pérdida, destrucción, robo o sustracción de un arma de 2ª o 3ª categoría, se entrega al Interventor de Armas la licencia de armas correspondiente.","T4-13":"Ante la pérdida, destrucción, robo o sustracción de la propia licencia de armas, puede solicitarse en la Intervención de Armas una autorización temporal de uso de armas.","T4-14":"Cuando la licencia está próxima a caducar, los Interventores de Armas pueden expedir una autorización temporal de uso de armas mientras se resuelve la renovación.","T4-15":"La autorización temporal de uso de armas la expiden los Interventores de Armas a quienes tienen la licencia próxima a caducar, con una vigencia de tres meses y solo para el uso de las armas (no amplía otros derechos).","T4-16":"Estas autorizaciones temporales, para quienes solicitan la renovación de su licencia próxima a caducar, tienen un plazo de validez de tres meses.","T4-17":"Es el Interventor de Armas y Explosivos quien expide la autorización temporal de uso de armas a los titulares con licencia próxima a caducar que solicitan su renovación.","T4-18":"Las armas de categoría 2ª.2 (largas rayadas para caza mayor) deben documentarse con guía de pertenencia, un documento por cada arma.","T4-19":"Las armas de categoría 3ª.2 (escopetas y demás largas de ánima lisa) se documentan también con guía de pertenencia.","T4-20":"Las armas de categoría 3ª.3 (accionadas por aire u otro gas comprimido con energía superior a 24,2 julios) se documentan igualmente con guía de pertenencia.","T4-21":"Las ballestas (categoría 7ª.2) se documentan con guía de pertenencia, igual que otras armas asimiladas a escopeta.","T4-22":"Las armas para lanzar cabos (categoría 7ª.3) también se documentan con guía de pertenencia.","T4-23":"En cada guía de pertenencia se reseña una sola arma.","T4-24":"La guía de pertenencia debe acompañar al arma en caso de uso, depósito y transporte, es decir, en las tres situaciones citadas.","T4-25":"Los arcos están exceptuados de necesitar guía de pertenencia, a diferencia de escopetas y pistolas, que sí la requieren.","T4-26":"El fusil de inyección anestésica está exceptuado de guía de pertenencia, a diferencia de la pistola lanzabengalas o el fusil lanzacabos.","T4-27":"Con una guía de varios cuerpos se pueden legalizar escopetas y rifles a la vez del mismo titular, más allá de amparar una sola escopeta.","T4-28":"Además del DNI, los datos de la licencia y del propietario, en la guía de pertenencia debe figurar la reseña completa del arma (marca, modelo, calibre, número de serie, etc.).","T4-29":"Quien necesite armas utilizables para caza mayor debe obtener la licencia de armas «D», la específica para ese uso.","T4-30":"Para un cañón estriado adaptable a escopeta de caza, con recámara para cartuchos metálicos, no clasificado como arma de guerra, se necesita licencia de armas «D».","T4-31":"La licencia «D» ampara las armas largas rayadas para caza mayor, no las escopetas ni los fusiles lanzacabos.","T4-32":"Para llevar y usar armas largas rayadas calibre 5,6 mm (.22 americano) de percusión anular para tiro deportivo (categoría 3ª.1) se necesita licencia «E».","T4-33":"Para poseer, llevar y usar ballestas (categoría 7ª.2) se necesita licencia de armas «E».","T4-34":"La licencia «E» autoriza a poseer, llevar y usar armas de las categorías 3ª, 7ª.2 y 7ª.3.","T4-35":"Con licencia «E» el número máximo de armas es de 6 escopetas o 6 armas largas rayadas para tiro deportivo, sin superar en total 12 armas.","T4-36":"Con una licencia de armas «E» pueden ampararse hasta seis escopetas.","T4-37":"Con una licencia «E» pueden ampararse hasta seis armas largas rayadas para tiro deportivo.","T4-38":"Con licencia de armas tipo «D» no puede legalizarse ninguna carabina de aire comprimido: estas se legalizan con tarjetas de armas que expiden los alcaldes.","T4-39":"El titular de armas de fuego que viaje con ellas por países de la Unión Europea debe ser portador de la Tarjeta Europea de Armas.","T4-40":"La Tarjeta Europea de Armas tiene una vigencia de cinco años.","T4-41":"En la Tarjeta Europea de Armas figuran las armas que lleve o utilice su titular, no solo las cortas ni únicamente las amparadas con guía especial.","T4-42":"El solicitante de licencia «E» acredita que se dedica al ejercicio de la caza mediante la exhibición de su licencia de caza en vigor.","T4-43":"Sí, presentar la licencia de caza en vigor es suficiente para que el solicitante de una licencia «E» acredite que practica la caza.","T4-44":"La Tarjeta Europea de Armas puede expedirse tanto a españoles como a extranjeros residentes en España.","T4-45":"Para renovar la Tarjeta Europea de Armas se exige mantener la titularidad de las armas que ampara.","T4-46":"Las autorizaciones especiales de uso de armas para menores tienen validez hasta que el menor alcanza la mayoría de edad.","T4-47":"Para usar un arma larga rayada de caza mayor o de tiro deportivo, el menor debe tener como mínimo 16 años.","T4-48":"Para usar armas de las categorías 3ª.2 y 3ª.3, el menor debe tener como mínimo 14 años, un límite menor que para caza mayor o tiro deportivo con arma rayada (16 años).","T4-49":"Los menores que utilicen armas de las categorías 2ª.2 o 3ª deben ir siempre acompañados de personas mayores de edad que posean licencia de armas D, E o F.","T4-50":"El adulto con licencia D, E o F que acompaña a un menor con autorización especial se compromete previamente a acompañarlo y vigilarlo en cada cacería o acto deportivo, no solo a llevarlo hasta el lugar.","T4-51":"Un menor no puede ser titular de una escopeta bajo ningún concepto, ni siquiera con autorización especial (esta le permite usarla, pero la titularidad exige mayoría de edad).","T4-52":"Una licencia «D» expedida a una persona de 55 años tiene un plazo de validez de cinco años, el régimen general antes de los tramos de edad avanzada.","T4-53":"Una licencia «E» expedida a alguien de entre 50 y 60 años tiene una validez de cinco años.","T4-54":"Un joven de 17 años puede tener como máximo dos licencias de armas tipo «E», siempre que no tenga licencia «D».","T4-55":"Las solicitudes de autorización especial de uso de armas para menores deben estar suscritas tanto por el interesado como por quien ejerce su patria potestad o tutela.","T4-56":"Una licencia «E» expedida a una persona de 62 años tiene una validez de tres años, al entrar en el tramo de mayor edad.","T4-57":"Una licencia «D» expedida a una persona de 68 años tiene una validez de cinco años, visada cada tres.","T4-58":"Una licencia «E» expedida a una persona de 72 años tiene una validez de cinco años, visada cada tres, igual criterio que la licencia D en edades avanzadas.","T4-59":"Una licencia «D» expedida a una persona de 71 años es permanente, al superar la edad a partir de la cual cambia el régimen de validez.","T4-60":"A partir de los sesenta y siete años es necesario visar la licencia, conforme al tramo de edad que marca el Reglamento.","T4-61":"Una solicitud de licencia de armas debe resolverse en el plazo de tres meses.","T4-62":"Si no se mantienen los requisitos exigidos para el otorgamiento de una licencia de armas, procede revocarla.","T4-63":"Según el Reglamento de Armas, una licencia puede revocarse por el tiempo que le falte para caducar, no por un plazo fijo de dos o tres años.","T4-64":"La Administración puede comprobar en cualquier momento que se mantienen los requisitos exigibles para conservar la vigencia de una licencia de armas.","T4-65":"La vigencia de una licencia de armas está condicionada al mantenimiento de los requisitos exigibles en el Reglamento de Armas, no solo a la residencia o a una edad límite concreta.","T4-66":"Las pruebas de capacitación para obtener licencia de armas largas rayadas o escopetas consisten en conocer las armas, su cuidado y conservación, y tener habilidad para su manejo y utilización.","T4-67":"Es el Interventor de Armas quien expide la guía de pertenencia de un arma.","T4-68":"A la solicitud de licencia «D» deben unirse tanto el certificado de antecedentes penales y el informe de aptitud psicofísica como la fotocopia del DNI o tarjeta de residencia: todo lo reseñado en ambas opciones.","T4-69":"Para solicitar la licencia «E» hay que presentar certificado de antecedentes penales en vigor, informe de aptitud psicofísica y acreditación de dedicarse realmente a la caza o al deporte correspondiente.","T4-70":"El certificado del alcalde no es obligatorio para la expedición de la licencia «E»; sí lo son el informe de aptitudes psicofísicas y el certificado de antecedentes penales.","T5-13":"El almacenamiento sin autorización de un arma larga rayada, si no es delito, se tipifica como infracción muy grave.","T5-14":"El mismo almacenamiento sin autorización, pero de un arma larga de ánima lisa, es infracción muy grave igualmente.","T5-15":"La insuficiencia de medidas de seguridad al almacenar un arma larga rayada se considera infracción muy grave.","T5-16":"La omisión (ausencia total) de esas medidas de seguridad al almacenar un arma larga rayada también es infracción muy grave, igual que la mera insuficiencia.","T5-17":"Tener una escopeta sin guía de pertenencia se considera infracción muy grave («gravísima» en el enunciado), no leve.","T5-18":"Por una infracción muy grave al Reglamento de Armas, la multa va de 30.050,61 a 601.012,10 euros.","T5-19":"La reparación sin autorización de una ballesta, si no es delito, se considera infracción grave.","T5-20":"La reparación sin autorización de un arma para lanzar cabos también se tipifica como infracción grave.","T5-21":"El almacenamiento sin autorización de una ballesta se considera infracción grave (a diferencia de las armas largas rayadas o de ánima lisa, que son muy graves).","T5-22":"El almacenamiento sin autorización de un arma para lanzar cabos también es infracción grave.","T5-23":"La omisión de medidas de seguridad al almacenar un arma que exige licencia «E» se considera infracción grave.","T5-24":"La insuficiencia (no la ausencia total) de esas medidas de seguridad en armas de licencia «E» también se tipifica como grave.","T5-25":"La omisión de medidas de seguridad en la fase de circulación de un arma de licencia «E» es infracción grave.","T5-26":"La insuficiencia de esas medidas en circulación, para armas de licencia «E», también es infracción grave.","T5-27":"La insuficiencia de medidas de seguridad al almacenar en el domicilio un arma larga rayada es infracción grave (distinto del almacenamiento sin autorización, que era muy grave).","T5-28":"La omisión total de esas medidas en el domicilio, para un arma larga rayada, también se considera grave.","T5-29":"La omisión de medidas de seguridad al almacenar en el lugar de uso (no en el domicilio) un arma larga rayada es igualmente infracción grave.","T5-30":"La insuficiencia de medidas de seguridad al almacenar en el domicilio un arma larga de ánima lisa es infracción grave.","T5-31":"La omisión de esas medidas en el domicilio, para un arma larga de ánima lisa, también es grave.","T5-32":"La omisión de medidas de seguridad al almacenar en el lugar de uso un arma larga de ánima lisa es infracción grave.","T5-33":"Impedir a las autoridades competentes los controles necesarios sobre la tenencia de un arma es infracción grave.","T5-34":"Impedir esos controles relativos a la utilización de un arma también es infracción grave.","T5-35":"Impedir los controles relativos al almacenamiento de un arma es igualmente infracción grave.","T5-36":"La adquisición de armas de las categorías 2ª.2 y 3ª.2 por particulares sin las autorizaciones o licencias pertinentes es infracción grave.","T5-37":"La tenencia (no solo la adquisición) de esas mismas armas sin autorización o licencia también es infracción grave.","T5-38":"La cesión de armas de esas categorías sin autorización o licencia es infracción grave.","T5-39":"La enajenación de esas armas sin autorización o licencia es igualmente infracción grave.","T5-40":"Alegar datos falsos para obtener las licencias correspondientes se considera infracción grave.","T5-41":"Usar un arma reglamentaria omitiendo las medidas de seguridad obligatorias para las personas o cosas es infracción grave.","T5-42":"Usar un arma reglamentaria con medidas de seguridad insuficientes (no su omisión total) también es infracción grave.","T5-43":"Portar armas en establecimientos públicos no habilitados para ello es infracción grave.","T5-44":"Portar armas en lugares de reunión no habilitados es igualmente infracción grave.","T5-45":"Portar armas en lugares de concentración no habilitados también es infracción grave.","T5-46":"Portar armas en un lugar de recreo no habilitado es infracción grave.","T5-47":"Portar armas en un lugar de esparcimiento no habilitado también es infracción grave.","T5-48":"Tener en el domicilio un arma larga rayada de la 2ª.2, sin armero o caja fuerte para su custodia, constituye infracción grave.","T5-49":"Tener una escopeta con la licencia caducada, aunque solo hayan pasado 20 días, constituye infracción grave; el poco tiempo transcurrido no la convierte en leve ni la exime.","T5-50":"Alegar un domicilio en el que realmente no se reside para documentar una escopeta se considera infracción grave.","T5-51":"Negarse a presentar un rifle y su documentación a un policía nacional que lo requiere es infracción grave.","T5-52":"Por una infracción grave al Reglamento de Armas, la multa va de 300,51 a 30.050,61 euros.","T5-53":"La adquisición de ballestas por particulares sin autorización o licencia se considera infracción leve.","T5-54":"La tenencia de ballestas sin autorización o licencia también se considera infracción leve.","T5-55":"La cesión de ballestas sin autorización o licencia es igualmente infracción leve.","T5-56":"La enajenación de ballestas sin autorización o licencia se considera infracción leve.","T5-57":"No comunicar a la Guardia Civil la destrucción de la documentación de un arma es infracción leve.","T5-58":"No comunicar la pérdida de la documentación de un arma también es infracción leve.","T5-59":"No comunicar la sustracción de la documentación de un arma es igualmente infracción leve.","T5-60":"No realizar las declaraciones obligatorias se considera infracción leve.","T5-61":"No pasar la revista de armas constituye infracción leve.","T5-62":"Por una infracción leve al Reglamento de Armas, la multa es de hasta 300,51 euros.","T5-63":"La retirada de las armas implica la desposesión de las mismas y la prohibición de adquirir y tener otras, no solo dejar de usarlas temporalmente.","T5-64":"Se considera ilícito que los asistentes a establecimientos públicos o lugares de reunión lleven o usen armas; no es lícito por motivos de seguridad ni vale como defensa en una casa de campo.","T5-65":"No se puede recortar por cuenta propia diez centímetros el cañón de una escopeta, aunque sea para mejorar el plomeo en la caza del conejo: la modificación no autorizada está prohibida.","T5-66":"Que a alguien lo sorprenda la Autoridad con un cargador de 25 cartuchos para arma corta sin autorización conlleva, además del expediente sancionador, tanto la retirada de todas sus licencias como la incautación de los cargadores.","T6-1":"Es cierto: la reparación de armas solo puede hacerla la industria fabricante o armeros autorizados por la Intervención de Armas, con establecimiento abierto e inscrito en su registro.","T6-2":"Al entregar un arma para reparar, se aporta al armero la guía de pertenencia o, en su caso, la guía de circulación.","T6-3":"La guía de pertenencia de un arma reparada se devuelve a su propietario una vez recuperada el arma.","T6-4":"Sí, el titular puede llevar personalmente su arma a reparar.","T6-5":"Si el arma procede de otra localidad y no la lleva personalmente su propietario, debe sustituirse la guía de pertenencia por una guía de circulación expedida por la Intervención de Armas de origen.","T6-6":"Para reparar armas de fuego es imprescindible tener la condición de armero, con establecimiento abierto e inscrito en el registro de la Intervención de Armas de su residencia.","T6-7":"Sí, es imprescindible obtener la condición de armero para dedicarse a la reparación de armas de fuego.","T6-8":"Las industrias que fabrican armas de fuego sí están autorizadas a repararlas.","T6-9":"No se admite un arma para reparar sin la guía de pertenencia, en ningún caso.","T6-10":"El titular puede llevar personalmente su arma a reparar siempre que vaya acompañada de la guía de pertenencia.","T6-11":"La reparación de armas solo puede hacerla la industria fabricante o los armeros autorizados con establecimiento inscrito: ambas opciones son válidas conjuntamente.","T6-12":"No se admite un arma a reparar si no va acompañada de guía de pertenencia o, en su caso, de guía de circulación.","T6-13":"La guía de pertenencia queda en poder del armero mientras dura la reparación del arma.","T6-14":"La guía de pertenencia se entrega al titular en el momento de retirar el arma de la armería, no antes.","T6-15":"Al dejar el arma para reparar, el titular entrega al armero también la guía de pertenencia.","T6-16":"Sin conocimiento de la Intervención de Armas, no está permitido en ningún caso reparar modificando las características, estructura o calibre de un arma de caza.","T6-17":"Puede modificarse el calibre de un arma si es de caza y está aprobado por un banco oficial de pruebas y notificado a la Intervención de Armas, o si la variación la ha hecho el propio fabricante y ha entregado la documentación técnica correspondiente: ambos supuestos son válidos.","T6-18":"La modificación sustancial de las características de un arma solo se permite con conocimiento de la Intervención de Armas y, en su caso, aprobación del Ministerio de Defensa o del Banco Oficial de Pruebas.","T6-19":"Para modificar el calibre de un arma se precisa la aprobación del Ministerio de Defensa tanto si se trata de armas de 1ª y 2ª categoría como si son armas de guerra: ambas respuestas son correctas.","T6-20":"La estructura de un arma puede cambiarse con conocimiento previo de la Intervención de Armas y, en su caso, aprobación del Ministerio de Defensa o de un Banco Oficial de Pruebas, según el arma.","T6-21":"Un arma de caza sí puede repararse con modificación sustancial si cuenta con conocimiento y aprobación de los organismos competentes; no está prohibido de forma absoluta.","T6-22":"Los fabricantes y comerciantes autorizados, y sus representantes, pueden dejar a prueba las armas a personas que posean la licencia correspondiente.","T6-23":"Tanto los fabricantes y comerciantes autorizados como sus representantes pueden dejar a prueba las armas de fuego.","T6-24":"Los comerciantes autorizados no pueden dejar a probar un arma a una persona sin licencia de armas.","T6-25":"El documento para probar un arma en la misma localidad de residencia del interesado tiene una validez de 5 días.","T6-26":"En el documento de prueba no puede omitirse el lugar donde se va a efectuar la prueba con el arma.","T6-27":"Sí, cualquier titular de licencia de armas correspondiente y en vigor puede probar las armas de fuego que desea adquirir.","T6-28":"Sí, la persona interesada en comprar un arma puede probarla antes de adquirirla en una galería autorizada.","T6-29":"Una persona con licencia de armas puede probar un arma de caza si se la deja un comerciante autorizado.","T6-30":"Para poder probar un arma, la persona interesada debe estar en posesión de la correspondiente licencia; no basta con ir acompañada ni con una autorización del vendedor.","T6-31":"El documento personal e intransferible de prueba debe contener la reseña del arma, la licencia y el lugar de las pruebas, sus plazos de validez, y estar visado por la Intervención de Armas.","T6-32":"El documento que expide el fabricante o comerciante para probar el arma tiene carácter personal e intransferible.","T6-33":"El fabricante debe expedir al interesado un documento personal e intransferible visado por la Intervención de Armas y Explosivos.","T6-34":"El documento de autorización para probar un arma debe ser visado por la Intervención de Armas.","T6-35":"Ese documento de autorización para la prueba se formaliza conforme a un modelo oficial.","T6-36":"Además de en campos de federaciones deportivas o en polígonos, campos o galerías de tiro, las armas pueden probarse en terrenos que cuenten con autorización de la autoridad local.","T6-37":"Sí, las armas de fuego se pueden probar en galerías de tiro.","T6-38":"Un arma de fuego nunca puede probarse en la vía pública, bajo ninguna circunstancia.","T6-39":"Los herederos o albaceas deben depositar las armas del fallecido tan pronto como tengan conocimiento de esa obligación y, en cualquier caso, dentro de los 6 meses siguientes al fallecimiento.","T6-40":"Es cierto que, al cesar en la habilitación para tener legalmente las armas, el interesado debe depositarlas inmediatamente, según el Reglamento.","T6-41":"Al cesar en la habilitación, el interesado queda exento del depósito inmediato si comunica la circunstancia a la Intervención de Armas y adopta medidas suficientes de seguridad para evitar su pérdida o sustracción.","T6-42":"Si no se pasan dos revistas consecutivas y se retira la guía de pertenencia, el arma debe depositarse.","T6-43":"Las armas depositadas por fallecimiento del titular permanecen un año a disposición de los herederos.","T6-44":"A las armas depositadas por fallecimiento debe acompañarlas la guía de pertenencia junto con el certificado de defunción.","T6-45":"En caso de caducidad de la licencia de armas, el titular debe depositarlas inmediatamente.","T6-46":"A las armas de fuego que se depositen deben acompañarlas las guías de pertenencia correspondientes.","T6-47":"Quien extravía la licencia de armas debe depositar las armas junto con sus guías de pertenencia.","T6-48":"Quien extravía las guías de pertenencia debe depositar las armas que amparaban esas guías.","T6-49":"Es cierto: el titular de un arma de fuego no puede depositarla voluntariamente en la Intervención de Armas y Explosivos para que sea subastada.","T6-50":"No: el titular de un arma de fuego no puede depositarla en la Intervención de Armas y Explosivos para que sea subastada (coincide con la pregunta anterior).","T6-51":"No puede depositarse un arma para reducirla a chatarra salvo que carezca de los punzones necesarios o esté prohibida: ese es el único destino reglamentario de reducción a chatarra.","T6-52":"Procede el depósito del arma y la retirada y anulación de la guía de pertenencia cuando no se pasan dos revistas consecutivas, no con una sola falta.","T6-53":"En caso de fallecimiento del titular, los familiares deben depositar las armas en la Intervención de Armas, no usarlas libremente ni transmitirlas directamente al hijo mayor.","T6-54":"Los herederos de un arma depositada por fallecimiento del titular tienen un año de plazo para enajenarla.","T6-55":"Si se anula la guía de pertenencia de un arma, esta debe depositarse inmediatamente en la Intervención de Armas.","T6-56":"Los herederos de una escopeta disponen del plazo de seis meses desde el fallecimiento del titular para depositarla, y en cualquier caso tan pronto como tengan conocimiento de la obligación: ambas afirmaciones son correctas conjuntamente.","T6-57":"En esta variante, el plazo correcto vuelve a ser dentro de los seis meses siguientes al fallecimiento, no al año.","T6-58":"Una escopeta depositada por infracción a la Ley de Caza no podrá ser recuperada por su dueño.","T6-59":"Las armas depositadas por infracción a la Ley de Caza, si su titular no las reclama, quedan depositadas hasta que la Autoridad Judicial decida sobre ellas.","T6-60":"Las armas depositadas por herencia que, transcurrido el plazo reglamentario, no han sido ni enajenadas ni recuperadas, se reducen a chatarra si no se ha pedido expresamente su subasta.","T6-61":"Un arma depositada que, pasados los plazos reglamentarios, no ha sido transferida, se destruye.","T6-62":"Las armas llegadas a un aeropuerto y no retiradas tras el despacho de aduanas quedan depositadas como máximo durante seis meses a disposición del interesado.","T6-63":"Esas armas no retiradas en el aeropuerto quedan depositadas en la Intervención de Armas y Explosivos.","T6-64":"Un arma con valor acreditado de patrimonio histórico que lleva un año depositada se enajena en pública subasta, salvo que la Autoridad Judicial disponga otra cosa según el caso."};BANK.forEach(x=>{if(EX[x.id])x.ex=EX[x.id]});
