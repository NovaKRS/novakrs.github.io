function illustration(id){const k=ILLUS_BY_ID[id];if(!k)return '';const x=ONLINE_ILLUS[k];return `<div class="illus"><div class="illusTitle">${x.title}</div><div class="illusFrame"><img src="${x.url}" alt="${x.title}" loading="eager"></div><div class="illusCaption">Fuente: ${x.source}.</div></div>`}

function drawLearn(){const{arr,i}=S.learn,x=arr[i];state.seen[x.id]=true;save();const img=illustration(x.id);
app.innerHTML=`<div class="panel"><div class="row"><span class="pill">Tema ${x.theme} · P${x.n}</span><span class="small muted">${i+1}/${arr.length}</span><button class="secondary" style="margin-left:auto" data-act="home">Inicio</button></div>${themeSel("learn",S.learn.theme)}${img}<div class="q">${esc(x.q)}</div>${x.o.map((o,j)=>`<div class="opt ${j===x.a?"correct":""}"><span class="letter">${L[j]}.</span>${esc(o)}${j===x.a?" ✔":""}</div>`).join("")}${hint(x)}
<div class="row" style="margin-top:13px"><button class="secondary" data-act="prev" ${i===0?"disabled":""}>← Anterior</button><button class="primary" data-act="next" ${i===arr.length-1?"disabled":""}>Siguiente →</button></div></div>`}
function practice(pool,label="",errs=false){setTab("practice");if(!pool.length){home();return}S.pr={theme:themeOf(pool),src:pool,pool:shuffle(pool),i:0,score:0,done:false,errs,label};drawPr()}
function drawPr(){const p=S.pr;if(p.i>=p.pool.length){app.innerHTML=`<div class="panel"><h2>Práctica terminada</h2><p>Resultado: <b>${p.score}/${p.pool.length}</b></p><div class="row"><button class="primary" data-act="again">Repetir</button><button class="secondary" data-act="home">Inicio</button></div></div>`;return}
const x=p.pool[p.i];p.done=false;
app.innerHTML=`<div class="panel"><div class="row"><span class="pill">Tema ${x.theme}</span><span class="small">${p.i+1}/${p.pool.length}</span><button class="secondary" style="margin-left:auto" data-act="home">Salir</button></div>${themeSel("practice",S.pr.theme)}<div class="q">${esc(x.q)}</div>${x.o.map((o,j)=>`<button class="opt" data-act="ans" data-v="${j}"><span class="letter">${L[j]}.</span>${esc(o)}</button>`).join("")}<div id="fb"></div></div>`}
function answer(j){const p=S.pr,x=p.pool[p.i];if(p.done)return;p.done=true;state.seen[x.id]=true;state.answered++;
if(j===x.a){p.score++;state.correct++;if(p.errs)state.wrong=state.wrong.filter(w=>w!==x.id)}else if(!state.wrong.includes(x.id))state.wrong.push(x.id);save();
document.querySelectorAll(".opt").forEach((b,k)=>{if(k===x.a)b.classList.add("correct");if(k===j&&j!==x.a)b.classList.add("wrong")});
document.getElementById("fb").innerHTML=`<p><b>${j===x.a?"✔ Correcto":"✘ Incorrecto"}</b></p>${hint(x)}<button class="primary" style="margin-top:10px" data-act="cont">${p.i+1>=p.pool.length?"Ver resultado":"Continuar →"}</button>`}
function exam(){setTab("exam");S.ex={qs:shuffle(BANK).slice(0,20),i:0,ans:{},end:Date.now()+20*60*1000,fin:false};drawEx();timer=setInterval(tick,500)}
function tick(){const e=S.ex;if(!e||e.fin){stop();return}const left=Math.max(0,e.end-Date.now()),el=document.getElementById("timer");if(el)el.textContent=String(Math.floor(left/60000)).padStart(2,"0")+":"+String(Math.floor(left/1000)%60).padStart(2,"0");if(left<=0)finish()}
function drawEx(){const e=S.ex,x=e.qs[e.i],n=Object.keys(e.ans).length;
app.innerHTML=`<div class="panel"><div class="row"><span class="pill">Simulacro</span><span class="small">Pregunta ${e.i+1}/20 · contestadas ${n}/20</span><span id="timer" class="timer">20:00</span></div><div class="q">${esc(x.q)}</div>${x.o.map((o,j)=>`<button class="opt ${e.ans[x.id]===j?"correct":""}" data-act="pick" data-v="${j}"><span class="letter">${L[j]}.</span>${esc(o)}</button>`).join("")}
<div class="row" style="margin-top:13px"><button class="secondary" data-act="eprev" ${e.i===0?"disabled":""}>← Anterior</button>${e.i<19?`<button class="primary" data-act="enext">Siguiente →</button>`:""}<button class="${e.i===19?"primary":"secondary"}" data-act="finish" style="margin-left:auto">Finalizar</button></div>
<div class="row" style="margin-top:12px;gap:5px">${e.qs.map((q,k)=>`<button class="secondary" data-act="goto" data-v="${k}" style="padding:5px 8px;${k===e.i?"outline:2px solid var(--blue);":""}${e.ans[q.id]!==undefined?"background:#d1e0ff;":""}">${k+1}</button>`).join("")}</div></div>`;tick()}
function finish(){const e=S.ex;if(!e||e.fin)return;e.fin=true;stop();const bad=e.qs.filter(x=>e.ans[x.id]!==x.a),score=20-bad.length;
bad.forEach(x=>{if(!state.wrong.includes(x.id))state.wrong.push(x.id)});save();
app.innerHTML=`<div class="panel"><h2>Resultado: ${score}/20 · ${score>=16?"APTO ✔":"NO APTO ✘"}</h2><p class="muted">Criterio de la prueba: 20 preguntas, 20 minutos y mínimo 16 correctas. Las falladas o sin contestar se han guardado en Errores.</p><div class="row"><button class="primary" data-act="exam">Nuevo simulacro</button><button class="secondary" data-act="home">Inicio</button></div></div>
${bad.length?`<div class="panel"><h3>Revisión (${bad.length})</h3>${bad.map(x=>`<div style="border-top:1px solid var(--line);padding:10px 0"><div class="small muted">Tema ${x.theme} · P${x.n} · ${e.ans[x.id]===undefined?"sin contestar":"tu respuesta: "+L[e.ans[x.id]]}</div><div class="q" style="font-size:16px">${esc(x.q)}</div><div class="answer">Correcta: ${L[x.a]} · ${esc(x.o[x.a])}</div></div>`).join("")}</div>`:""}`}
function mistakes(){setTab("mistakes");const ids=new Set(state.wrong),arr=BANK.filter(x=>ids.has(x.id));
if(!arr.length){app.innerHTML='<div class="panel"><h2>Sin errores guardados</h2><p class="muted">Aparecen aquí las preguntas que falles en Practicar o Simulacro.</p></div>';return}
app.innerHTML=`<div class="panel"><h2>${arr.length} errores</h2><div class="row"><button class="primary" data-act="learnErr">Repasar (Aprender)</button><button class="secondary" data-act="practiceErr">Practicar errores</button></div></div>`}
const ACT={home,prev(){S.learn.i=Math.max(0,S.learn.i-1);drawLearn()},next(){S.learn.i=Math.min(S.learn.arr.length-1,S.learn.i+1);drawLearn()},
learnTheme:v=>learn(BANK.filter(x=>x.theme==v)),practiceTheme:v=>practice(BANK.filter(x=>x.theme==v)),one:v=>learn([byId(v)]),
ans:v=>answer(+v),cont(){S.pr.i++;drawPr()},again(){practice(S.pr.src,S.pr.label,S.pr.errs)},
pick(v){const e=S.ex;e.ans[e.qs[e.i].id]=+v;drawEx()},eprev(){S.ex.i--;drawEx()},enext(){S.ex.i++;drawEx()},goto(v){S.ex.i=+v;drawEx()},
finish(){const n=20-Object.keys(S.ex.ans).length;if(n===0||confirm(`Te quedan ${n} sin contestar. ¿Finalizar?`))finish()},exam,
learnErr(){const s=new Set(state.wrong);learn(BANK.filter(x=>s.has(x.id)))},practiceErr(){const s=new Set(state.wrong);practice(BANK.filter(x=>s.has(x.id)),"",true)},
reset(){if(confirm("¿Borrar todo el progreso?")){try{localStorage.removeItem("DEGC_OFFLINE_STATE")}catch(e){}location.reload()}}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&!b.disabled&&ACT[b.dataset.act])ACT[b.dataset.act](b.dataset.v)});
document.addEventListener("change",e=>{const m=e.target.dataset&&e.target.dataset.sel;if(!m)return;const v=+e.target.value,a=v?BANK.filter(x=>x.theme===v):BANK;m==="learn"?learn(a):practice(a)});
document.addEventListener("input",e=>{if(e.target.id==="search")search(e.target.value)});
document.addEventListener("keydown",e=>{if(!document.querySelector(".opt.correct")||!S.learn||document.querySelector("#timer"))return;if(e.key==="ArrowRight")ACT.next();if(e.key==="ArrowLeft")ACT.prev()});
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{const t=b.dataset.tab;if(t==="home")home();if(t==="learn")learn(BANK);if(t==="practice")practice(BANK);if(t==="exam")exam();if(t==="mistakes")mistakes()});
home();
</script>
</body>
</html>
