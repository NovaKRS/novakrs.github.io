const ROCAS=[["Obsidiana","Magmática volcánica","Parece cristal negro y muy brillante: es lava que se enfrió de golpe."],
["Pizarra","Metamórfica","Gris oscuro, en láminas finas y planas que se separan: la de los tejados."],
["Conglomerado","Sedimentaria detrítica","Cantos redondeados (piedrecitas) pegados con un cemento natural."],
["Pumita","Magmática volcánica","Llena de agujeritos, muy ligera: flota en el agua. Es la piedra pómez."],
["Arcilla","Sedimentaria detrítica","Grano finísimo, suave; con agua se puede moldear (barro)."],
["Esquisto","Metamórfica","En láminas onduladas que brillan con reflejos."],
["Carbón","Sedimentaria orgánica","Negro, mancha los dedos; viene de restos de plantas."],
["Granito","Magmática plutónica","Puntos de tres colores: blancos o rosados (feldespato), grises (cuarzo) y negros (mica)."],
["Basalto","Magmática volcánica","Oscuro, casi negro, de grano muy fino: no se ven los cristales."],
["Sienita","Magmática plutónica","Parecida al granito, con cristales grandes, pero casi sin cuarzo; suele ser rosada o grisácea."],
["Gneis","Metamórfica","Con bandas claras y oscuras, como rayas."],
["Arenisca","Sedimentaria detrítica","Granos de arena pegados; áspera al tacto, como papel de lija."]];
const ROCA_TIPOS=["Magmática volcánica","Magmática plutónica","Metamórfica","Sedimentaria detrítica","Sedimentaria orgánica"];
function rocaFig(n,k){return `<figure class="rfig"><img src="${ROCA_FOTOS[n][k]}" alt="Foto de una roca"><figcaption>Imagen del PDF del colegio</figcaption></figure>`}
function rocasMastered(){return results.filter(r=>r.key==="rocas"&&r.total&&r.ok/r.total>=.8).length>=1}
function viewRocas(){const a=$("#app");
  if(!state.rk){state.rk={mode:LS.get("rocasVisto",false)?"quiz":"ver",i:0}}const s=state.rk;
  const seg=`<div class="seg"><button data-rm="ver" aria-pressed="${s.mode==="ver"}">Aprender</button><button data-rm="quiz" aria-pressed="${s.mode==="quiz"}">¿Qué roca es?</button></div>`;
  const head=`<button class="back" data-go="inicio">← Volver</button><span class="qtag">Biología · Rocas</span><h1>Rocas por foto</h1>${seg}`;
  if(s.mode==="ver"){const R=ROCAS[s.i];
    a.innerHTML=`<div data-s="bio" class="wrap" style="gap:16px">${head}<section class="card"><div class="rfigs">${rocaFig(R[0],0)}${rocaFig(R[0],1)}</div>
      <h2 style="margin:0">${R[0]}</h2><p style="margin:0"><span class="tag-or">${R[1]}</span></p><p>${R[2]}</p>
      <div class="row" style="justify-content:space-between"><button class="btn ghost" id="rprev" ${s.i?"":"disabled"}>←</button><span class="small muted">${s.i+1} de ${ROCAS.length}</span><button class="btn" id="rnext">${s.i+1<ROCAS.length?"Siguiente →":"¡A probar!"}</button></div>${listenBtn("rlisten")}</section></div>`;
    $("#rprev").addEventListener("click",()=>{s.i--;viewRocas()});$("#rnext").addEventListener("click",()=>{if(s.i+1<ROCAS.length){s.i++;viewRocas()}else{LS.set("rocasVisto",true);state.rk={mode:"quiz"};viewRocas()}});
    $("#rlisten").addEventListener("click",()=>speak(R[0]+". "+R[1]+". "+R[2]));}
  else{if(!s.items){s.items=shuffle(ROCAS.map((R,j)=>({j,k:Math.random()<.5?0:1}))).slice(0,10);s.n=0;s.ok=0;s.fails=[];s.step=0;s.bad=false}
    if(s.n>=s.items.length){const pass=s.ok>=8||(s.attempt||1)>=2;if(!s.saved){s.saved=true;saveResult({key:"rocas",materia:"Rocas por foto",sub:"identificar rocas y su tipo"+((s.attempt||1)>=2?" · 2º intento":""),ok:s.ok,total:s.items.length,ns:0,temas:{},fallos:s.fails,cuenta:pass})}
      a.innerHTML=`<div data-s="bio" class="wrap" style="gap:16px">${head}<section class="card"><span class="big">${s.ok}/${s.items.length}</span><p>${pass?"¡Bien! Esto cuenta.":"Para terminar el bloque, otra ronda: necesitas 8 de 10."}</p>${s.fails.length?`<p class="small">Repasa: ${s.fails.map(esc).join(" · ")}</p>`:""}<div class="row"><button class="btn" id="ragain">Otra ronda</button><button class="btn ghost" data-rm="ver">Repasar las fotos</button></div></section></div>`;
      $("#ragain").addEventListener("click",()=>{const att=pass?1:(s.attempt||1)+1;state.rk={mode:"quiz",attempt:att};viewRocas()});}
    else{const it=s.items[s.n],R=ROCAS[it.j];
      if(!it.on){it.on=shuffle([R[0]].concat(shuffle(ROCAS.filter(x=>x[0]!==R[0]).map(x=>x[0])).slice(0,2)))}
      a.innerHTML=`<div data-s="bio" class="wrap" style="gap:16px">${head}<section class="card"><span class="small muted">${s.n+1} de ${s.items.length}</span><div class="rfigs">${rocaFig(R[0],it.k)}</div>
        <p class="qtext">${s.step===0?"¿Qué roca es?":`Es <b>${R[0]}</b>. ¿De qué tipo es?`}</p>
        <div class="opts">${(s.step===0?it.on:ROCA_TIPOS).map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div><div id="rfb"></div></section></div>`;
      const right=s.step===0?R[0]:R[1];
      a.querySelectorAll("[data-o]").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.o===right){b.classList.add("right");a.querySelectorAll(".opt").forEach(x=>x.disabled=true);beep(880,.12);
          if(s.step===0){setTimeout(()=>{s.step=1;viewRocas()},500)}else{if(!s.bad)s.ok++;else s.fails.push(R[0]+" ("+R[1].toLowerCase()+")");
            $("#rfb").innerHTML=`<div class="fb ok"><strong>${R[0]}: ${R[1].toLowerCase()}.</strong>${R[2]}</div><button class="btn" id="rnx">Siguiente →</button>`;$("#rnx").addEventListener("click",()=>{s.n++;s.step=0;s.bad=false;viewRocas()});$("#rnx").focus()}}
        else{b.classList.add("wrong");b.disabled=true;s.bad=true;$("#rfb").innerHTML=`<div class="fb ko"><strong>Todavía no.</strong>${s.step===0?"Fíjate en la pista: "+R[2]:"Piensa cómo se formó: "+R[2]}</div>`}}))}}
  a.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
  a.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{state.rk={mode:b.dataset.rm,i:0};viewRocas()}))}

/* ---------- Operaciones combinadas: modo «Escribiendo» (como en el examen) ---------- */
function cbKey(T){return T.map(x=>x.t==="n"?String(x.v):x.t==="o"?"(":x.t==="c"?")":x.v).join(" ")}
function cbClone(T){return T.map(x=>Object.assign({},x))}
function cbReach(T,depth){const seen=new Map();let fr=[T];for(let d=1;d<=depth;d++){const nf=[];fr.forEach(S=>cbValid(S).forEach(i=>{const N=cbClone(S);const r=cbCalc(N[i-1].v,N[i].v,N[i+1].v);if(!Number.isInteger(r))return;N.splice(i-1,3,{t:"n",v:r});cbCollapse(N);const k=cbKey(N);if(!seen.has(k)){seen.set(k,d);nf.push(N)}}));fr=nf}return seen}
function cbValue(T){let S=cbClone(T),g=0;while(S.length>1&&g++<60){const v=cbValid(S);if(!v.length)return NaN;const i=v[0];const r=cbCalc(S[i-1].v,S[i].v,S[i+1].v);S.splice(i-1,3,{t:"n",v:r});cbCollapse(S)}return S.length===1&&S[0].t==="n"?S[0].v:NaN}
function cbParseTyped(s){s=s.replace(/^\s*=\s*/,"").replace(/[·x×X]/g,"*").replace(/[:÷]/g,"/").replace(/[−–—]/g,"-").replace(/\s+/g,"").replace(/\./g,"");
  if(!s||!/^[-+*/()\[\]0-9]+$/.test(s))return null;let d=0;for(const ch of s){if("([".includes(ch))d++;if(")]".includes(ch))d--;if(d<0)return null}if(d)return null;
  const T=cbTok(s);for(let i=0;i<T.length;i++){const x=T[i],p=T[i-1];if(x.t==="op"&&(!p||p.t==="op"||p.t==="o"))return null;if(x.t==="n"&&p&&(p.t==="n"||p.t==="c"))return null}return T}
function cbPlain(T){return cbHtml(T).replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim()}
function cbModeDefault(){const L=LS.get("cbModo",null);if(L)return L;return results.filter(r=>r.key==="combinadas"&&r.total&&r.ok/r.total>=.7).length>=2?"escrito":"guiado"}
function viewCbEscrito(){const a=$("#app"),c=state.cb,T=c.T;
  const h=helpPanel("Operaciones combinadas",`Operación ${c.list[c.e].replace(/\*/g,"·").replace(/\//g,":")} (escribiendo)`,()=>{c.fails.push(c.list[c.e]+" (pendiente)");c.e++;if(c.e<c.list.length){c.T=cbTok(c.list[c.e]);c.lines=[]}c.tries=0;c.msg="";viewCombinadas()},c.tries>=2);
  a.innerHTML=`<div data-s="mat" class="wrap" style="gap:16px"><div class="qhead"><button class="back" data-go="inicio">← Pausar (se guarda)</button><span class="small muted">Operación ${c.e+1} de ${c.list.length}</span></div>
   <h1>Operaciones combinadas</h1>${cbModeSeg(c)}
   <section class="card"><div class="cblines">${c.lines.map((l,j)=>`<div class="cbl">${j?"= ":""}${l}</div>`).join("")}<div class="cbl cur">${c.lines.length?"= ":""}${cbPlain(T)}</div></div>
   <p class="small" style="margin:0">Escribe la <b>siguiente línea</b>: cambia solo lo que calculas y deja el resto igual. Ya tienes la línea copiada en la caja para que la modifiques.</p>
   <form id="cwf" class="col" style="gap:8px"><input id="cwin" class="txtin" autocomplete="off" spellcheck="false" style="max-width:none;font-size:1.2rem;font-variant-numeric:tabular-nums" aria-label="Siguiente línea">
   <div class="row" style="gap:6px">${["·",":","−","+","(",")","[","]"].map(k=>`<button type="button" class="chip kb" data-k="${k}">${k}</button>`).join("")}<button class="btn">Comprobar</button></div></form>
   <p class="small muted" style="margin:0">También puedes usar * para · y / para :.</p>
   <div id="cfb">${c.msg||""}</div>${h.html}</section>
   <section class="card"><h3>El orden</h3><ol style="margin:0;padding-left:1.2em"><li>Paréntesis y corchetes (el más interior primero).</li><li>Multiplicaciones y divisiones, de izquierda a derecha.</li><li>Sumas y restas, de izquierda a derecha.</li></ol></section></div>`;
  a.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));bindCbSeg();
  h.bind(()=>`Está haciendo operaciones combinadas con enteros escribiendo cada línea. Línea actual: ${cbPlain(T)}. No le des la siguiente línea; guíale con la jerarquía y los signos.`);
  const inp=$("#cwin");inp.value=c.draft!==undefined?c.draft:cbPlain(T);inp.focus();inp.addEventListener("input",()=>{c.draft=inp.value});
  a.querySelectorAll(".kb").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.k,p=inp.selectionStart||inp.value.length,q=inp.selectionEnd||p;inp.value=inp.value.slice(0,p)+k+inp.value.slice(q);inp.focus();inp.setSelectionRange(p+1,p+1);c.draft=inp.value}));
  $("#cwf").addEventListener("submit",e=>{e.preventDefault();const U=cbParseTyped(inp.value);const fb=$("#cfb");
    if(!U){fb.innerHTML=`<div class="fb ns"><strong>No entiendo lo que has escrito.</strong>Usa números, + − · : y paréntesis. Revisa que cada paréntesis que abres se cierre.</div>`;return}
    const kU=cbKey(U);if(kU===cbKey(T)){fb.innerHTML=`<div class="fb ns"><strong>Es la misma línea.</strong>Haz al menos una operación: cambia esa parte por su resultado.</div>`;return}
    const R=cbReach(T,5);const v0=cbValue(T);
    const accept=(note)=>{if(!c.tries)c.okSteps++;c.steps++;c.lines.push(cbPlain(T));c.T=U.length===1?U:cbCollapse(U);c.tries=0;c.draft=undefined;c.msg=note?`<div class="fb ok"><strong>Bien.</strong>${note}</div>`:"";beep(880,.12);viewCombinadas()};
    if(R.has(kU)){const d=R.get(kU);accept(d>2?"Has hecho varias operaciones de golpe. En el examen, mejor una o dos por línea: así es más difícil equivocarse.":"");return}
    if(cbValue(U)===v0){accept("El resultado cuadra, pero revisa el orden: primero paréntesis, luego · y :, luego + y −.");return}
    c.tries++;c.steps++;const i0=cbValid(T)[0],A=T[i0-1].v,OP=T[i0].v,B=T[i0+1].v,r=cbCalc(A,OP,B);
    if(c.tries===1)c.fails.push(`${cbPlain(T)} → escribió ${inp.value.trim()}`);
    const N=cbClone(T);N.splice(i0-1,3,{t:"n",v:r});cbCollapse(N);
    c.msg=c.tries>=3?`<div class="fb ns"><strong>Te lo enseño:</strong>Lo primero era ${zIn(A)} ${OP} ${zIn(B)} = ${fmtZ(r)}. La línea queda así:<br><b>= ${cbPlain(N)}</b><br>Escríbela (o corrige la tuya) para seguir.</div>`
      :c.tries===2?`<div class="fb ko"><strong>Intento 2 de 3: todavía no.</strong>${cbHints(A,OP,B)[0]}</div>`
      :`<div class="fb ko"><strong>Intento 1 de 3: todavía no.</strong>Algo no cuadra. Lo primero que toca es <b>${zIn(A)} ${OP} ${zIn(B)}</b>. Revisa también que el resto de la línea esté copiado igual.</div>`;
    c.steps--;viewCombinadas()});
}
function cbModeSeg(c){return `<div class="seg"><button data-cbm="guiado" aria-pressed="${c.modo!=="escrito"}">Guiado</button><button data-cbm="escrito" aria-pressed="${c.modo==="escrito"}">Escribiendo (como en el examen)</button></div>`}
function bindCbSeg(){document.querySelectorAll("[data-cbm]").forEach(b=>b.addEventListener("click",()=>{const c=state.cb;c.modo=b.dataset.cbm;LS.set("cbModo",c.modo);c.phase="pick";c.sel=undefined;c.tries=0;c.msg="";c.draft=undefined;viewCombinadas()}))}

/* ---------- Problemas con negativos, escribiendo la operación ---------- */
const PROBS=[
{q:"El punto más alto de la Tierra está a 8.848 m y el más bajo, en el fondo del mar, a 11.510 m de profundidad. ¿Qué diferencia de nivel hay entre los dos?",ans:20358,u:"m",sol:"8.848 − (−11.510) = 20.358 m",tip:"El fondo del mar es −11.510. Diferencia = el de arriba − el de abajo. ¿Cruza el 0?"},
{q:"Pitágoras nació en el 570 a. C. y murió en el 495 a. C. ¿Cuántos años vivió?",ans:75,u:"años",sol:"−495 − (−570) = 75 años",tip:"Antes de Cristo es negativo: −570 y −495. Años vividos = muerte − nacimiento."},
{q:"Pitágoras murió en el 495 a. C. ¿Cuántos años han pasado hasta 2026?",ans:2521,u:"años",sol:"2026 − (−495) = 2.521 años",tip:"Cruza el año 0: de −495 a 2026. Resta: 2026 − (−495)."},
{q:"Una cámara frigorífica está a 12 °C y baja 3 °C cada 15 minutos. ¿Cuántos minutos tarda en llegar a −24 °C?",ans:180,u:"minutos (3 horas)",sol:"(12 − (−24)) : 3 · 15 = 36 : 3 · 15 = 180 minutos = 3 horas",tip:"Primero, cuántos grados baja en total: 12 − (−24). Luego, cuántas veces son 3 grados, y cada vez son 15 minutos."},
{q:"A las 7 de la mañana había −4 °C y a mediodía 9 °C. ¿Cuántos grados subió la temperatura?",ans:13,u:"°C",sol:"9 − (−4) = 13 °C",tip:"Subida = temperatura final − temperatura inicial."},
{q:"Arquímedes nació en el 287 a. C. y murió en el 212 a. C. ¿Cuántos años vivió?",ans:75,u:"años",sol:"−212 − (−287) = 75 años",tip:"Muerte − nacimiento, con los dos años en negativo."},
{q:"Un submarino está a 120 m de profundidad y sube 45 m. ¿A qué altura queda? (Escribe la operación con negativos.)",ans:-75,u:"m (75 m de profundidad)",sol:"−120 + 45 = −75 m",tip:"Profundidad = negativo: empiezas en −120 y subes 45."},
{q:"Un ascensor está en el sótano −2. Sube 7 plantas y luego baja 3. ¿En qué planta está?",ans:2,u:"(planta 2)",sol:"−2 + 7 − 3 = 2",tip:"Empieza en −2, suma lo que sube y resta lo que baja."},
{q:"Tengo 30 € en la cuenta y pago una compra de 45 €. ¿Cómo queda la cuenta?",ans:-15,u:"€",sol:"30 − 45 = −15 €",tip:"Lo que tengo − lo que pago."},
{q:"Un buzo está a 18 m de profundidad y baja el doble de esa profundidad. ¿A qué profundidad llega? (Escribe la operación con negativos.)",ans:-36,u:"m",sol:"(−18) · 2 = −36 m",tip:"Profundidad = negativo. El doble: multiplicar por 2."}];
function viewProblemas(){const a=$("#app");if(!state.pb)state.pb={items:shuffle(PROBS.map((x,j)=>j)).slice(0,4),i:0,ok:0,fails:[],tries:0};const s=state.pb;
  if(s.i>=s.items.length){const pass=s.ok>=3||(s.attempt||1)>=2;if(!s.saved){s.saved=true;saveResult({key:"problemas",materia:"Problemas con negativos",sub:"escribiendo la operación"+((s.attempt||1)>=2?" · 2º intento":""),ok:s.ok,total:s.items.length,ns:0,temas:{},fallos:s.fails,cuenta:pass})}
    a.innerHTML=`<div data-s="mat" class="wrap" style="gap:16px"><button class="back" data-go="inicio">← Volver</button><h1>Problemas con negativos</h1><section class="card"><span class="big">${s.ok}/${s.items.length}</span><p>${pass?"¡Bien! Esto cuenta.":"Para terminar el bloque, otra ronda: ya conoces los trucos."}</p><div class="row"><button class="btn" id="pag">Otra ronda</button></div></section></div>`;
    a.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));$("#pag").addEventListener("click",()=>{const att=pass?1:(s.attempt||1)+1;state.pb=null;viewProblemas();state.pb.attempt=att});return}
  const P=PROBS[s.items[s.i]];
  const h=helpPanel("Problemas con negativos",P.q.slice(0,80),()=>{s.fails.push(P.q.slice(0,50)+"… (pendiente)");s.i++;s.tries=0;s.msg="";viewProblemas()},s.tries>=2);
  a.innerHTML=`<div data-s="mat" class="wrap" style="gap:16px"><div class="qhead"><button class="back" data-go="inicio">← Pausar (se guarda)</button><span class="small muted">${s.i+1} de ${s.items.length}</span></div><h1>Problemas con negativos</h1>
   <section class="card"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><p class="qtext">${esc(P.q)}</p>${listenBtn("plisten")}</div>
   ${s.done?"":`<p class="small" style="margin:0">Escribe la <b>operación</b> con números negativos (por ejemplo: <i>5 − (−3)</i>). La app la calcula y comprueba.</p>
   <form id="pf" class="col" style="gap:8px"><input id="pin" class="txtin" autocomplete="off" spellcheck="false" style="max-width:none;font-size:1.2rem" aria-label="Operación"><div class="row" style="gap:6px">${["−","+","·",":","(",")"].map(k=>`<button type="button" class="chip kb" data-k="${k}">${k}</button>`).join("")}<button class="btn">Comprobar</button></div></form>`}
   <div id="pfb">${s.msg||""}</div>${s.done?"":h.html}</section>
   <section class="card"><h3>Los trucos</h3><ul style="margin:0;padding-left:1.2em"><li>Bajo el mar, bajo cero o antes de Cristo → <b>negativo</b>.</li><li>Diferencia o «cuánto ha pasado» → <b>final − inicial</b> (o el mayor − el menor).</li><li>¿Cruza el 0? Entonces se suman las dos distancias.</li></ul></section></div>`;
  a.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));$("#plisten").addEventListener("click",()=>speak(P.q));
  const nb=$("#pnext");if(nb)nb.addEventListener("click",()=>{s.i++;s.tries=0;s.msg="";s.done=false;viewProblemas()});
  if(s.done)return;h.bind(()=>`Está resolviendo este problema de números enteros: ${P.q}. No le des la operación ni el resultado; ayúdale a pasar el enunciado a números negativos.`);
  const inp=$("#pin");inp.focus();
  a.querySelectorAll(".kb").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.k,p=inp.selectionStart||inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(p);inp.focus();inp.setSelectionRange(p+1,p+1)}));
  $("#pf").addEventListener("submit",e=>{e.preventDefault();const raw=inp.value.split("=")[0];const U=cbParseTyped(raw);const fb=$("#pfb");
    if(!U){fb.innerHTML=`<div class="fb ns"><strong>No entiendo la operación.</strong>Escribe solo números, signos y paréntesis, por ejemplo 9 − (−4).</div>`;return}
    if(U.length===1){fb.innerHTML=`<div class="fb ns"><strong>Escribe la operación, no solo el resultado.</strong>En el examen, sin operación no puntúa.</div>`;return}
    const v=cbValue(U),neg=U.some(x=>x.t==="n"&&x.v<0);
    if(v===P.ans&&neg){if(!s.tries)s.ok++;s.done=true;beep(880,.15);s.msg=`<div class="fb ok"><strong>¡Bien! ${esc(P.sol)}</strong></div><button class="btn" id="pnext">Siguiente →</button>`;viewProblemas();return}
    if(v===P.ans&&!neg){fb.innerHTML=`<div class="fb ns"><strong>El resultado está bien, pero falta usar negativos.</strong>El profesor pide escribir la operación con números negativos. ${esc(P.tip)}</div>`;return}
    s.tries++;if(s.tries===1)s.fails.push(P.q.slice(0,50)+"… → escribió "+inp.value.trim());
    s.msg=s.tries>=3?`<div class="fb ns"><strong>Te lo enseño:</strong>${esc(P.sol)}. Escríbela para seguir.</div>`:`<div class="fb ko"><strong>Intento ${s.tries} de 3: todavía no.</strong>${s.tries===1?"Tu operación da "+fmtZ(v)+". "+esc(P.tip):"Pista: "+esc(P.sol.split("=")[0].replace(/\d/g,"_"))+"= ?"}</div>`;
    viewProblemas()});
}


/* ---------- Puntos de concentración y racha (estilo Duolingo: premia pensar con calma, no correr) ---------- */
const XP_META=30;
function xpData(){return LS.get("xp",{d:{},tot:0})}
function xpToday(){return xpData().d[todayStr()]||0}
function xpStreak(){const d=xpData().d;let n=0;const t=new Date();if((d[todayStr()]||0)<XP_META)t.setDate(t.getDate()-1);
  for(let k=0;k<60;k++){const ds=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");if((d[ds]||0)>=XP_META){n++;t.setDate(t.getDate()-1)}else break}return n}
function addXP(n){if(!n)return;const x=xpData();const t=todayStr();const before=x.d[t]||0;x.d[t]=before+n;x.tot=(x.tot||0)+n;LS.set("xp",x);
  try{const el=document.createElement("div");el.className="xptoast";el.textContent="+"+n;document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}catch(e){}
  if(before<XP_META&&x.d[t]>=XP_META){logEvent({evento:"meta diaria de puntos",materia:"racha "+xpStreak()+" días"});try{beep(988,.2);setTimeout(()=>beep(1319,.25),180)}catch(e){}}}
function xpHtml(){const x=xpData(),t=xpToday(),st=xpStreak(),lvl=Math.floor((x.tot||0)/150)+1,pc=Math.min(100,Math.round(t/XP_META*100));
  return `<div class="xpbar" role="group" aria-label="Puntos de hoy"><span class="flame">${st?"🔥":"⭐"}</span><div style="flex:1;display:flex;flex-direction:column;gap:4px"><div class="row" style="justify-content:space-between;gap:6px"><b>${t>=XP_META?"¡Meta de hoy conseguida!":`Hoy: ${t} de ${XP_META} puntos`}</b><span class="small muted">${st?`Racha: ${st} ${st===1?"día":"días"}`:"Empieza tu racha"} · Nivel ${lvl}</span></div><div class="ring"><i style="width:${pc}%"></i></div><span class="small muted">Ganas puntos pensando con calma. Si vas muy rápido, no suman.</span></div></div>`}

/* ---------- Preguntas atascadas: explicación de verdad y otra forma de preguntarlas ---------- */
const EXPL={
"¿Qué roca se forma cuando el magma se enfría rápido en la superficie?":"Si el magma se enfría <b>rápido</b>, fuera, en un volcán, los cristales no tienen tiempo de crecer y sale una roca de grano muy fino: el <b>basalto</b>. Si se enfría <b>despacio</b>, dentro de la Tierra, los cristales crecen y se ven bien: el <b>granito</b>. Truco: <b>b</b>asalto, <b>b</b>rusco (rápido).",
"El granito está formado por…":"Mira un trozo de granito: tiene puntitos de tres tipos. Los grises y brillantes son <b>cuarzo</b>, los blancos o rosados son <b>feldespato</b> y los negros que brillan son <b>mica</b>. Como tiene varios minerales, es una roca heterogénea. Truco: <b>C</b>uarzo, <b>F</b>eldespato, <b>M</b>ica → «<b>C</b>ome <b>F</b>resas con <b>M</b>iel».",
"La corteza continental está formada sobre todo por…":"Los continentes están hechos de una roca más ligera, el <b>granito</b>. El fondo del mar es de <b>basalto</b>, más pesado, que sale por los volcanes del fondo marino. Para recordarlo: continente → granito; océano → basalto.",
"Una roca formada por un solo mineral, como el mármol, es…":"<b>Homo</b> significa «igual»: toda la roca es del mismo mineral, como el mármol. <b>Hetero</b> significa «distinto»: varios minerales mezclados, como el granito. Un solo mineral → <b>homogénea</b>.",
"Las dorsales oceánicas son…":"Son grietas enormes en el fondo del mar. Por ellas sale magma que, al enfriarse en el agua, forma <b>basalto</b> nuevo. Por eso el fondo del océano es de basalto.",
"¿Cuál es la capa más densa de la Tierra?":"«Densa» quiere decir mucha materia apretada en poco sitio. Cuanto más hacia el centro, más densa. El <b>núcleo interno</b> es de hierro y níquel y soporta tanta presión que es sólido: es la capa más densa.",
"La sal de cocina es el mineral llamado…":"La sal de cocina es la <b>halita</b>. Truco: «hals» significa «sal» en griego; halita = sal.",
"El campo magnético de la Tierra sirve para…":"La Tierra funciona como un imán gigante. Ese campo magnético hace de <b>escudo</b> contra la radiación dañina del Sol. Las mareas no son cosa del magnetismo: las provoca la Luna.",
"Los minerales más abundantes de la corteza son…":"Los dos elementos que más hay en la corteza son el oxígeno y el silicio. Juntos forman los <b>silicatos</b> (cuarzo, feldespato, mica…), que son la gran mayoría de la corteza.",
"¿Qué grosor tiene la corteza oceánica?":"La corteza oceánica es <b>fina</b>: entre 5 y 10 km. La continental es mucho más gruesa: entre 35 y 70 km. Océano → fina; continente → gruesa.",
"La erosión, el transporte y la sedimentación son la fase … del ciclo de las rocas.":"La erosión, el transporte y la sedimentación pasan <b>fuera</b>, en la superficie, por el agua, el viento o el hielo: es la fase <b>externa</b>. Lo que pasa dentro (magma, calor, presión) es la fase interna.",

  {const day=new Date(ds+"T12:00").getDate();
   if(ds<"2026-11-16")out.push(["ing","Verbos irregulares: 5 minutos",5,"verbs",1,{}]);
   if(ds>="2026-11-09"&&ds<"2026-11-18"&&day%2===1){const sets=[{set:"esp",modo:"find"},{set:"eur",modo:"find"},{set:"espf",modo:"what"},{set:"eur",modo:"cap"},{set:"eurf",modo:"what"}];out.push(["gh","Mapas: 5 minutos",5,"mapas",1,sets[Math.floor(day/2)%sets.length]])}

  M.forEach(m=>v.b.forEach(b=>{if(b[3]===m[3])b.mand=true}));
  M.forEach(m=>{if(has(m))return;
    const light=["verbs","rocas","tarjetas-len","mapas"].includes(m[3]);const pref=dayKind(d)==="entreno"&&!light?[T[0]]:(m[5]&&m[5].nivel&&dayKind(d)!=="entreno")||light?T.slice().reverse():T;/* pruebas de nivel: mejor en la última tanda; Mates: en la primera */
    let t=pref.find(k=>(used[k]||0)+m[2]<=tc[k]);
    if(t===undefined){t=pref[0];/* primero acortar bloques (mínimo 8 min) y solo si no basta, quitar */
      let guard=0;while((used[t]||0)+m[2]>tc[t]&&guard++<60){const sh=v.b.filter(b=>b[6]===t&&!b.mand&&b[2]>8).sort((x,y)=>y[2]-x[2])[0];if(!sh)break;sh[2]--;used[t]--}
      while((used[t]||0)+m[2]>tc[t]){const cand=v.b.map((b,j)=>j).filter(j=>v.b[j][6]===t&&!v.b[j].mand);if(!cand.length)break;
      cand.sort((x,y)=>examDays(v.b[y][0],ds)-examDays(v.b[x][0],ds));const i=cand[0];used[t]-=v.b[i][2];v.b.splice(i,1)}}
    const nb=m.concat([t]);nb.mand=true;v.b.push(nb);used[t]=(used[t]||0)+m[2]});
  v.b.sort((a,b)=>a[6]-b[6]);return v}

function tPick(sel,mode){const st=LS.get("tablas",{});const pool=[];sel.forEach(a=>{for(let b=2;b<=10;b++){const lv=tLevel(st[a+"x"+b]);const w=lv==="r"?6:lv==="a"?3:lv==="v"?1:3;for(let k=0;k<w;k++)pool.push([a,b])}});
  const out=[];let last="";for(let i=0;i<TQ&&pool.length;i++){let p,tries=0;do{p=pool[Math.floor(Math.random()*pool.length)];tries++}while(p[0]+"x"+p[1]===last&&tries<10);last=p[0]+"x"+p[1];
